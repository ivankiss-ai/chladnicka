<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chladnička Kiosk v12</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-dark: #121214;
            --card-bg: #1e1e24;
            --text-main: #ffffff;
            --text-muted: #a0a0ab;
            --color-out: #ef4444;
            --color-in: #22c55e;
            --color-ret: #eab308;
            --color-warn: #f97316;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 8px solid var(--color-out);
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        body.mode-in { border-color: var(--color-in); }
        body.mode-ret { border-color: var(--color-ret); }
        body.flash-error { background-color: #450a0a; border-color: #ff0000; }

        .modes-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            padding: 8px;
            background: #09090b;
            flex-shrink: 0;
        }

        .mode-btn {
            padding: 12px 6px;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            color: white;
            background: var(--card-bg);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .mode-btn span.sub { font-size: 0.72rem; font-weight: 400; opacity: 0.85; }
        .mode-btn.active-out { background: var(--color-out); }
        .mode-btn.active-in { background: var(--color-in); color: #000; }
        .mode-btn.active-ret { background: var(--color-ret); color: #000; }

        .main-layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 10px;
            padding: 0 10px 10px 10px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
                grid-template-rows: 245px 1fr;
            }
        }

        .scanner-panel {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 0;
        }

        .camera-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 110px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #reader {
            width: 100%;
            height: 100%;
            transition: transform 0.2s ease;
        }

        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        .laser-line {
            position: absolute;
            left: 10%;
            right: 10%;
            top: 50%;
            height: 2px;
            background: rgba(239, 68, 68, 0.85);
            box-shadow: 0 0 8px #ef4444;
            pointer-events: none;
            z-index: 5;
        }

        #start-cam-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 10px;
            text-align: center;
        }

        .big-start-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
        }

        .status-box {
            background: #121214;
            padding: 6px 8px;
            border-radius: 8px;
            text-align: center;
            min-height: 46px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-shrink: 0;
        }

        .status-title { font-weight: bold; font-size: 0.9rem; }
        .status-sub { font-size: 0.74rem; color: var(--text-muted); margin-top: 2px; }

        .manual-input { display: flex; gap: 6px; flex-shrink: 0; }
        .manual-input input {
            flex: 1;
            background: #121214;
            border: 1px solid #333;
            color: white;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .manual-input button {
            background: #3f3f46;
            color: white;
            border: none;
            padding: 0 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .inventory-panel {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .inv-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #2e2e36;
            gap: 6px;
            flex-shrink: 0;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .tool-btn {
            background: #27272a;
            color: white;
            border: 1px solid #3f3f46;
            padding: 6px 9px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .tool-btn.active-toggle {
            background: #1d4ed8;
            border-color: #60a5fa;
        }

        .tool-btn.cloud-on {
            background: #065f46;
            border-color: #10b981;
        }

        .filter-sort-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .search-wrap {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .search-wrap input {
            width: 100%;
            background: #121214;
            border: 1px solid #3f3f46;
            color: white;
            padding: 8px 28px 8px 10px;
            border-radius: 8px;
            font-size: 0.88rem;
        }

        .clear-search {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            color: #a0a0ab;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .sort-select {
            background: #121214;
            border: 1px solid #3f3f46;
            color: white;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.82rem;
            max-width: 175px;
        }

        .inv-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .inv-item {
            background: #121214;
            padding: 9px 11px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #3f3f46;
            gap: 8px;
        }

        .inv-item.opened { border-left-color: var(--color-ret); }
        .inv-item.exp-soon { border-left-color: var(--color-warn); background: #231810; }
        .inv-item.expired { border-left-color: var(--color-out); background: #261212; }
        .inv-item.empty { opacity: 0.45; }

        .item-info { flex: 1; min-width: 0; }
        .item-name { font-size: 0.96rem; font-weight: 600; word-break: break-word; }
        .item-meta { font-size: 0.74rem; color: var(--text-muted); margin-top: 2px; }

        .badge {
            font-size: 0.66rem;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 4px;
            margin-left: 4px;
            display: inline-block;
        }
        .badge-open { background: var(--color-ret); color: #000; }
        .badge-exp-soon { background: var(--color-warn); color: #000; }
        .badge-expired { background: var(--color-out); color: #fff; }

        .item-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .qty-badge { font-size: 1.15rem; font-weight: 800; min-width: 28px; text-align: center; }
        .ctrl-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: #27272a;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 18px;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            max-height: 92dvh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-content input[type="text"],
        .modal-content input[type="date"],
        .modal-content input[type="number"] {
            padding: 10px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #444;
            background: #121214;
            color: white;
            width: 100%;
        }

        .quick-days {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .quick-days button {
            padding: 8px 4px;
            background: #27272a;
            color: white;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .ocr-box {
            position: relative;
            width: 100%;
            height: 170px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }

        .ocr-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ocr-box video.mirrored {
            transform: scaleX(-1);
        }

        .ocr-guide {
            position: absolute;
            left: 6%;
            right: 6%;
            top: 50%;
            height: 80px;
            transform: translateY(-50%);
            border: 3px solid #22c55e;
            border-radius: 8px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
            pointer-events: none;
        }

        .modal-actions { display: flex; gap: 8px; margin-top: 4px; }
        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="modes-bar">
        <button id="btn-out" class="mode-btn active-out" onclick="setMode('OUT')">
            🔴 VÝBER (-1)
            <span class="sub">Predvolený režim</span>
        </button>
        <button id="btn-in" class="mode-btn" onclick="setMode('IN')">
            🟢 NÁKUP (+1)
            <span class="sub" id="timer-in">Vkladám dnu</span>
        </button>
        <button id="btn-ret" class="mode-btn" onclick="setMode('RET')">
            🟡 VRÁTENIE
            <span class="sub" id="timer-ret">Otvorené / Späť</span>
        </button>
    </div>

    <div class="main-layout">
        <div class="scanner-panel">
            <div class="camera-wrapper">
                <div id="reader"></div>
                <div class="laser-line"></div>
                <div id="start-cam-overlay">
                    <button class="big-start-btn" onclick="initCameras()">📷 ZAPNÚŤ KAMERU</button>
                    <p style="font-size: 0.78rem; color: #ccc; margin-top: 6px;">Ťukni pre spustenie snímača</p>
                </div>
            </div>
            <div class="status-box" id="status-box">
                <div class="status-title">Čakám na zapnutie kamery</div>
                <div class="status-sub">Ťukni na modré tlačidlo vyššie</div>
            </div>
            <div class="manual-input">
                <input type="text" id="manual-ean" placeholder="Alebo zadaj EAN ručne..." inputmode="numeric">
                <button onclick="manualScan()">OK</button>
            </div>
        </div>

        <div class="inventory-panel">
            <div class="inv-header">
                <h3>🧊 V chladničke (<span id="total-count">0</span> ks)</h3>
                <div class="toolbar">
                    <button class="tool-btn" id="btn-ask-exp" onclick="toggleAskExpiry()">📅 Spotreba: VYP</button>
                    <button class="tool-btn" onclick="switchCamera()">🔄 Kamera</button>
                    <button class="tool-btn" id="btn-zoom" onclick="cycleZoom()">🔍 1x</button>
                    <button class="tool-btn" onclick="toggleTorch()">🔦</button>
                    <button class="tool-btn" onclick="stopCamera()">⏹ Vypnúť</button>
                    <button class="tool-btn" onclick="exportBackup()">💾 Záloha</button>
                    <button class="tool-btn" onclick="document.getElementById('import-file').click()">📂 Obnoviť</button>
                    <button class="tool-btn" id="btn-cloud" onclick="openCloudModal()">☁️ Cloud</button>
                    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importBackup(event)">
                </div>
            </div>

            <div class="filter-sort-bar">
                <div class="search-wrap">
                    <input type="text" id="search-input" placeholder="🔍 Hľadať produkt alebo EAN..." oninput="renderInventory()">
                    <button class="clear-search" onclick="clearSearch()">✕</button>
                </div>
                <select id="sort-select" class="sort-select" onchange="renderInventory()">
                    <option value="exp-asc">Spotreba: Najskôr končiace</option>
                    <option value="exp-desc">Spotreba: Najdlhšia trvanlivosť</option>
                    <option value="recent">Prirodzene (Posledná zmena)</option>
                    <option value="alpha">Abecedne (A – Z)</option>
                </select>
            </div>

            <div class="inv-list" id="inv-list"></div>
        </div>
    </div>

    <!-- Modal: Nový produkt -->
    <div class="modal" id="name-modal">
        <div class="modal-content">
            <h3>Nový produkt</h3>
            <p style="color:var(--text-muted); font-size:0.85rem;">Kód <strong id="modal-ean"></strong> sa nenašiel. Pomenuj ho:</p>
            <input type="text" id="modal-name-input" placeholder="Napr. Plnotučné mlieko 1L">
            <div class="modal-actions">
                <button style="background:#3f3f46; color:white;" onclick="closeModal('name-modal')">Zrušiť</button>
                <button style="background:var(--color-in); color:black;" onclick="saveNewProductName()">Uložiť</button>
            </div>
        </div>
    </div>

    <!-- Modal: Dátum spotreby + OCR -->
    <div class="modal" id="expiry-modal">
        <div class="modal-content">
            <h3>📅 Dátum spotreby</h3>
            <p style="color:var(--text-muted); font-size:0.85rem;" id="exp-product-title"></p>
            
            <div class="quick-days">
                <button onclick="setQuickExpiry(2)">+2 dni</button>
                <button onclick="setQuickExpiry(5)">+5 dní</button>
                <button onclick="setQuickExpiry(14)">+2 týždne</button>
                <button onclick="setQuickExpiry(30)">+1 mesiac</button>
            </div>

            <input type="date" id="exp-date-input">

            <div style="display:flex; gap:6px;">
                <button class="tool-btn" style="flex:1; padding:10px; background:#1d4ed8;" onclick="startOcrCamera()">📷 Prečítať dátum aktívnou kamerou</button>
                <button class="tool-btn" style="padding:10px;" onclick="switchOcrCamera()">🔄</button>
            </div>

            <div class="ocr-box" id="ocr-box">
                <video id="ocr-video" autoplay playsinline></video>
                <div class="ocr-guide"></div>
            </div>
            <button id="btn-ocr-snap" class="big-start-btn" style="display:none; padding:12px; font-size:1rem; background:#22c55e; color:black;" onclick="captureAndReadDate()">📸 ODFOTIŤ A PREČÍTAŤ DÁTUM</button>
            <div id="ocr-status" style="font-size:0.8rem; color:#a0a0ab; text-align:center;"></div>

            <div class="modal-actions">
                <button style="background:#3f3f46; color:white;" onclick="closeExpiryModal()">Bez dátumu</button>
                <button style="background:var(--color-in); color:black;" onclick="saveExpiryDate()">Uložiť dátum</button>
            </div>
        </div>
    </div>

    <!-- Modal: Editácia položky -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <h3>✏️ Upraviť položku</h3>
            <label style="font-size:0.8rem; color:var(--text-muted);">Názov produktu:</label>
            <input type="text" id="edit-name-input">
            
            <label style="font-size:0.8rem; color:var(--text-muted);">Počet kusov:</label>
            <input type="number" id="edit-qty-input" min="0">
            
            <label style="font-size:0.8rem; color:var(--text-muted);">Dátum spotreby:</label>
            <div style="display:flex; gap:6px;">
                <input type="date" id="edit-exp-input" style="flex:1;">
                <button class="tool-btn" onclick="openOcrForEdit()">📷 Odfotiť</button>
            </div>

            <label style="display:flex; align-items:center; gap:8px; font-size:0.9rem; margin-top:4px;">
                <input type="checkbox" id="edit-opened-input" style="width:18px; height:18px;">
                Označiť ako otvorené / načaté
            </label>

            <div class="modal-actions">
                <button style="background:#991b1b; color:white;" onclick="deleteEditedItem()">🗑️ Zmazať</button>
                <button style="background:#3f3f46; color:white;" onclick="closeModal('edit-modal')">Zrušiť</button>
                <button style="background:var(--color-in); color:black;" onclick="saveEditedItem()">Uložiť</button>
            </div>
        </div>
    </div>

    <!-- Modal: Cloud Firebase -->
    <div class="modal" id="cloud-modal">
        <div class="modal-content">
            <h3>☁️ Cloud synchronizácia (Firebase)</h3>
            <p style="color:var(--text-muted); font-size:0.82rem;">Prepoj tablet a mobil cez bezplatnú Firebase Realtime Database:</p>
            <input type="text" id="fb-url-input" placeholder="https://tvoj-projekt.firebasedatabase.app">
            <input type="text" id="fb-room-input" placeholder="Tajný názov domácnosti (napr. rodina123)">
            <div class="modal-actions">
                <button style="background:#7f1d1d; color:white;" onclick="disconnectCloud()">Odpojiť</button>
                <button style="background:#3f3f46; color:white;" onclick="closeModal('cloud-modal')">Zavrieť</button>
                <button style="background:#10b981; color:black;" onclick="saveCloudSettings()">Pripojiť</button>
            </div>
        </div>
    </div>

    <canvas id="mirror-canvas" style="display:none;"></canvas>

    <script>
        let currentMode = 'OUT';
        let resetTimer = null;
        let countdownInterval = null;
        let lastScannedCode = null;
        let lastScanTime = 0;
        let pendingEan = null;
        let expiryTargetEan = null;
        let editingEan = null;
        let askExpiryEnabled = false;

        let cameras = [];
        let currentCameraIndex = 0;
        let html5QrCode = null;
        let isScanning = false;
        let mirrorInterval = null;
        let zoomLevels = [1, 1.5, 2];
        let zoomIdx = 0;
        let torchOn = false;

        let ocrStream = null;
        let ocrCamIndex = 0;
        let ocrTargetInputId = 'exp-date-input';

        let inventory = JSON.parse(localStorage.getItem('fridge_inventory')) || {};
        let productCatalog = JSON.parse(localStorage.getItem('fridge_catalog')) || {};
        let cloudConfig = JSON.parse(localStorage.getItem('fridge_cloud')) || null;
        let cloudPollTimer = null;

        function cleanEan(raw) {
            return String(raw || '').trim().replace(/^0+/, '') || String(raw || '').trim();
        }

        function findExistingEan(scannedRaw) {
            const rawTrim = String(scannedRaw || '').trim();
            if (inventory[rawTrim] || productCatalog[rawTrim]) return rawTrim;
            const norm = cleanEan(rawTrim);
            for (const k of Object.keys(inventory)) {
                if (cleanEan(k) === norm) return k;
            }
            for (const k of Object.keys(productCatalog)) {
                if (cleanEan(k) === norm) return k;
            }
            return rawTrim;
        }

        function playBeep(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (type === 'ERR') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                    return;
                }
                osc.frequency.setValueAtTime(type === 'IN' ? 780 : (type === 'OUT' ? 420 : 600), audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        function triggerZeroError(name) {
            playBeep('ERR');
            document.body.classList.add('flash-error');
            setTimeout(() => document.body.classList.remove('flash-error'), 650);
            updateStatus(`⛔ Položka má 0 ks: ${name}`, 'Prepni hore na zelený 🟢 NÁKUP (+1)');
        }

        function setMode(mode) {
            currentMode = mode;
            document.body.className = mode === 'IN' ? 'mode-in' : (mode === 'RET' ? 'mode-ret' : '');
            document.getElementById('btn-out').className = 'mode-btn' + (mode === 'OUT' ? ' active-out' : '');
            document.getElementById('btn-in').className = 'mode-btn' + (mode === 'IN' ? ' active-in' : '');
            document.getElementById('btn-ret').className = 'mode-btn' + (mode === 'RET' ? ' active-ret' : '');

            clearTimeout(resetTimer);
            clearInterval(countdownInterval);
            document.getElementById('timer-in').innerText = 'Vkladám dnu';
            document.getElementById('timer-ret').innerText = 'Otvorené / Späť';

            if (mode !== 'OUT') {
                let secondsLeft = 60;
                const targetLabel = mode === 'IN' ? 'timer-in' : 'timer-ret';
                document.getElementById(targetLabel).innerText = `Návrat za ${secondsLeft}s`;
                countdownInterval = setInterval(() => {
                    secondsLeft--;
                    document.getElementById(targetLabel).innerText = `Návrat za ${secondsLeft}s`;
                }, 1000);
                resetTimer = setTimeout(() => setMode('OUT'), 60000);
            }
        }

        function toggleAskExpiry() {
            askExpiryEnabled = !askExpiryEnabled;
            const btn = document.getElementById('btn-ask-exp');
            btn.innerText = askExpiryEnabled ? '📅 Spotreba: ZAP' : '📅 Spotreba: VYP';
            btn.classList.toggle('active-toggle', askExpiryEnabled);
        }

        async function handleScan(rawCode) {
            const ean = findExistingEan(rawCode);
            const now = Date.now();
            if (ean === lastScannedCode && (now - lastScanTime) < 3000) return;
            lastScannedCode = ean;
            lastScanTime = now;

            if (currentMode !== 'OUT') setMode(currentMode);

            let productName = productCatalog[ean] || (inventory[ean] && inventory[ean].name);

            if (currentMode === 'OUT' && (!inventory[ean] || inventory[ean].qty <= 0)) {
                triggerZeroError(productName || ean);
                return;
            }

            playBeep(currentMode);
            updateStatus(`Hľadám kód ${ean}...`, 'Overujem v databáze');

            if (!productName) {
                try {
                    const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${ean}.json`);
                    const data = await res.json();
                    if (data.status === 1 && data.product) {
                        productName = data.product.product_name_sk || data.product.product_name_cs || data.product.product_name || data.product.generic_name;
                    }
                } catch (e) {}
            }

            if (!productName) {
                pendingEan = ean;
                document.getElementById('modal-ean').innerText = ean;
                document.getElementById('modal-name-input').value = '';
                document.getElementById('name-modal').style.display = 'flex';
                document.getElementById('modal-name-input').focus();
                return;
            }

            productCatalog[ean] = productName;
            localStorage.setItem('fridge_catalog', JSON.stringify(productCatalog));
            applyInventoryChange(ean, productName);
        }

        function applyInventoryChange(ean, name) {
            if (!inventory[ean]) {
                inventory[ean] = { name: name, qty: 0, opened: false, expiry: '', updatedAt: Date.now(), updated: '' };
            }
            inventory[ean].name = name;
            inventory[ean].updatedAt = Date.now();
            inventory[ean].updated = new Date().toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });

            if (currentMode === 'IN') {
                inventory[ean].qty += 1;
                inventory[ean].opened = false;
                updateStatus(`✅ +1 ks: ${name}`, `Spolu v chladničke: ${inventory[ean].qty} ks`);
                saveAndSync();
                if (askExpiryEnabled) openExpiryModal(ean);
            } else if (currentMode === 'OUT') {
                if (inventory[ean].qty <= 0) {
                    triggerZeroError(name);
                    return;
                }
                inventory[ean].qty -= 1;
                if (inventory[ean].qty === 0) inventory[ean].opened = false;
                updateStatus(`🔴 -1 ks: ${name}`, `Zostáva: ${inventory[ean].qty} ks`);
                saveAndSync();
            } else if (currentMode === 'RET') {
                if (inventory[ean].qty === 0) inventory[ean].qty = 1;
                inventory[ean].opened = true;
                updateStatus(`🟡 Vrátené (otvorené): ${name}`, `Označené na skorú spotrebu`);
                saveAndSync();
                if (askExpiryEnabled) openExpiryModal(ean);
            }
        }

        function saveNewProductName() {
            const name = document.getElementById('modal-name-input').value.trim();
            if (!name || !pendingEan) return;
            productCatalog[pendingEan] = name;
            localStorage.setItem('fridge_catalog', JSON.stringify(productCatalog));
            closeModal('name-modal');
            applyInventoryChange(pendingEan, name);
            pendingEan = null;
        }

        function manualScan() {
            const input = document.getElementById('manual-ean');
            const val = input.value.trim();
            if (val) {
                lastScannedCode = null;
                handleScan(val);
                input.value = '';
            }
        }

        function adjustQty(ean, delta) {
            if (!inventory[ean]) return;
            if (delta < 0 && inventory[ean].qty <= 0) {
                triggerZeroError(inventory[ean].name);
                return;
            }
            inventory[ean].qty = Math.max(0, inventory[ean].qty + delta);
            inventory[ean].updatedAt = Date.now();
            inventory[ean].updated = new Date().toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });
            if (inventory[ean].qty === 0) inventory[ean].opened = false;
            saveAndSync();
        }

        function updateStatus(title, sub) {
            document.getElementById('status-box').innerHTML = `
                <div class="status-title">${title}</div>
                <div class="status-sub">${sub}</div>
            `;
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            renderInventory();
        }

        function getDaysLeft(dateStr) {
            if (!dateStr) return null;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const exp = new Date(dateStr + 'T00:00:00');
            return Math.round((exp - today) / 86400000);
        }

        function renderInventory() {
            const listEl = document.getElementById('inv-list');
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const sortMode = document.getElementById('sort-select').value;
            listEl.innerHTML = '';

            let total = 0;
            Object.values(inventory).forEach(it => total += (it.qty || 0));
            document.getElementById('total-count').innerText = total;

            let keys = Object.keys(inventory).filter(ean => {
                if (!query) return true;
                const name = (inventory[ean].name || '').toLowerCase();
                return name.includes(query) || ean.includes(query);
            });

            keys.sort((a, b) => {
                const ia = inventory[a];
                const ib = inventory[b];
                if (sortMode === 'alpha') {
                    return (ia.name || '').localeCompare(ib.name || '', 'sk', { sensitivity: 'base' });
                }
                if (sortMode === 'recent') {
                    return (ib.updatedAt || 0) - (ia.updatedAt || 0);
                }
                if (sortMode === 'exp-asc') {
                    if (ia.opened !== ib.opened) return (ib.opened ? 1 : 0) - (ia.opened ? 1 : 0);
                    const da = ia.expiry ? new Date(ia.expiry).getTime() : 9999999999999;
                    const db = ib.expiry ? new Date(ib.expiry).getTime() : 9999999999999;
                    return da - db;
                }
                if (sortMode === 'exp-desc') {
                    const da = ia.expiry ? new Date(ia.expiry).getTime() : -1;
                    const db = ib.expiry ? new Date(ib.expiry).getTime() : -1;
                    return db - da;
                }
                return 0;
            });

            keys.forEach(ean => {
                const item = inventory[ean];
                const days = getDaysLeft(item.expiry);
                let rowClass = '';
                let expBadge = '';

                if (days !== null) {
                    if (days < 0) {
                        rowClass = 'expired';
                        expBadge = `<span class="badge badge-expired">Po záruke (${item.expiry})</span>`;
                    } else if (days <= 3) {
                        rowClass = 'exp-soon';
                        expBadge = `<span class="badge badge-exp-soon">Končí o ${days} d. (${item.expiry})</span>`;
                    } else {
                        expBadge = `<span style="color:#a0a0ab;"> • Spotreba: ${item.expiry}</span>`;
                    }
                }

                if (item.opened) rowClass = 'opened';
                if (item.qty === 0) rowClass += ' empty';

                const div = document.createElement('div');
                div.className = `inv-item ${rowClass}`;
                div.innerHTML = `
                    <div class="item-info">
                        <div class="item-name">
                            ${item.name}
                            ${item.opened ? '<span class="badge badge-open">Otvorené</span>' : ''}
                            ${expBadge}
                        </div>
                        <div class="item-meta">EAN: ${ean} • ${item.updated || ''}</div>
                    </div>
                    <div class="item-controls">
                        <button class="ctrl-btn" onclick="openEditModal('${ean}')">✏️</button>
                        <button class="ctrl-btn" onclick="adjustQty('${ean}', -1)">-</button>
                        <div class="qty-badge">${item.qty}</div>
                        <button class="ctrl-btn" onclick="adjustQty('${ean}', 1)">+</button>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        function saveAndSync() {
            localStorage.setItem('fridge_inventory', JSON.stringify(inventory));
            renderInventory();
            pushToCloud();
        }

        // Editácia položky
        function openEditModal(ean) {
            const item = inventory[ean];
            if (!item) return;
            editingEan = ean;
            document.getElementById('edit-name-input').value = item.name || '';
            document.getElementById('edit-qty-input').value = item.qty || 0;
            document.getElementById('edit-exp-input').value = item.expiry || '';
            document.getElementById('edit-opened-input').checked = !!item.opened;
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function saveEditedItem() {
            if (!editingEan || !inventory[editingEan]) return;
            const newName = document.getElementById('edit-name-input').value.trim();
            if (newName) {
                inventory[editingEan].name = newName;
                productCatalog[editingEan] = newName;
                localStorage.setItem('fridge_catalog', JSON.stringify(productCatalog));
            }
            inventory[editingEan].qty = Math.max(0, parseInt(document.getElementById('edit-qty-input').value, 10) || 0);
            inventory[editingEan].expiry = document.getElementById('edit-exp-input').value;
            inventory[editingEan].opened = document.getElementById('edit-opened-input').checked;
            inventory[editingEan].updatedAt = Date.now();
            closeModal('edit-modal');
            saveAndSync();
        }

        function deleteEditedItem() {
            if (!editingEan) return;
            delete inventory[editingEan];
            closeModal('edit-modal');
            saveAndSync();
        }

        function openOcrForEdit() {
            ocrTargetInputId = 'edit-exp-input';
            expiryTargetEan = editingEan;
            document.getElementById('exp-product-title').innerText = inventory[editingEan].name;
            document.getElementById('exp-date-input').value = document.getElementById('edit-exp-input').value;
            document.getElementById('expiry-modal').style.display = 'flex';
            startOcrCamera();
        }

        // Dátum spotreby + OCR
        function openExpiryModal(ean) {
            expiryTargetEan = ean;
            ocrTargetInputId = 'exp-date-input';
            document.getElementById('exp-product-title').innerText = inventory[ean].name;
            document.getElementById('exp-date-input').value = inventory[ean].expiry || '';
            document.getElementById('ocr-status').innerText = '';
            document.getElementById('expiry-modal').style.display = 'flex';
        }

        function setQuickExpiry(days) {
            const d = new Date();
            d.setDate(d.getDate() + days);
            document.getElementById('exp-date-input').value = d.toISOString().split('T')[0];
        }

        function saveExpiryDate() {
            const val = document.getElementById('exp-date-input').value;
            if (expiryTargetEan && inventory[expiryTargetEan]) {
                inventory[expiryTargetEan].expiry = val;
                saveAndSync();
            }
            if (ocrTargetInputId === 'edit-exp-input') {
                document.getElementById('edit-exp-input').value = val;
            }
            closeExpiryModal();
        }

        function closeExpiryModal() {
            stopOcrCamera();
            document.getElementById('expiry-modal').style.display = 'none';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function isFrontCamera(cam) {
            if (!cam) return false;
            const lbl = (cam.label || '').toLowerCase();
            return lbl.includes('front') || lbl.includes('user') || lbl.includes('selfie') || lbl.includes('predn');
        }

        async function startOcrCamera() {
            stopOcrCamera();
            ocrCamIndex = currentCameraIndex;
            await launchOcrStream();
        }

        async function switchOcrCamera() {
            if (cameras.length <= 1) return;
            ocrCamIndex = (ocrCamIndex + 1) % cameras.length;
            stopOcrCamera();
            await launchOcrStream();
        }

        async function launchOcrStream() {
            const box = document.getElementById('ocr-box');
            const vid = document.getElementById('ocr-video');
            const btnSnap = document.getElementById('btn-ocr-snap');
            box.style.display = 'block';
            btnSnap.style.display = 'block';

            const cam = cameras[ocrCamIndex];
            vid.classList.toggle('mirrored', isFrontCamera(cam));

            try {
                const constraints = cam ? { video: { deviceId: { exact: cam.id } } } : { video: true };
                ocrStream = await navigator.mediaDevices.getUserMedia(constraints);
                vid.srcObject = ocrStream;
                document.getElementById('ocr-status').innerText = 'Namier dátum do zeleného rámika a odfoť';
            } catch (e) {
                document.getElementById('ocr-status').innerText = 'Nepodarilo sa spustiť kameru na dátum';
            }
        }

        function stopOcrCamera() {
            if (ocrStream) {
                ocrStream.getTracks().forEach(t => t.stop());
                ocrStream = null;
            }
            document.getElementById('ocr-box').style.display = 'none';
            document.getElementById('btn-ocr-snap').style.display = 'none';
        }

        function parseDateFromOcrText(text) {
            const cleaned = text.replace(/[^0-9.\-\/\s]/g, ' ').replace(/\s+/g, ' ').trim();
            // Formát DD.MM.RRRR alebo DD/MM/RR
            const fullMatch = cleaned.match(/(\d{1,2})[\.\/\-](\d{1,2})[\.\/\-](\d{2,4})/);
            if (fullMatch) {
                let d = parseInt(fullMatch[1], 10);
                let m = parseInt(fullMatch[2], 10);
                let y = parseInt(fullMatch[3], 10);
                if (y < 100) y += 2000;
                if (m >= 1 && m <= 12 && d >= 1 && d <= 31 && y >= 2024 && y <= 2040) {
                    return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                }
            }
            // Formát liekov MM RRRR, MM.RRRR, MM/RR
            const mmYyyyMatch = cleaned.match(/(\d{1,2})[\s\.\/\-]+(\d{2,4})/);
            if (mmYyyyMatch) {
                let m = parseInt(mmYyyyMatch[1], 10);
                let y = parseInt(mmYyyyMatch[2], 10);
                if (y < 100) y += 2000;
                if (m >= 1 && m <= 12 && y >= 2024 && y <= 2040) {
                    const lastDay = new Date(y, m, 0).getDate();
                    return `${y}-${String(m).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
                }
            }
            return null;
        }

        async function runTesseractOnCanvas(canvas) {
            const res = await Tesseract.recognize(canvas, 'eng', {
                tessedit_char_whitelist: '0123456789./- '
            });
            return res.data.text || '';
        }

        async function captureAndReadDate() {
            const vid = document.getElementById('ocr-video');
            const statusEl = document.getElementById('ocr-status');
            if (!vid.videoWidth) return;

            statusEl.innerText = '⏳ Čítam dátum z obrázka...';

            const vw = vid.videoWidth;
            const vh = vid.videoHeight;
            const cropW = Math.floor(vw * 0.88);
            const cropH = Math.floor(vh * 0.45);
            const sx = Math.floor((vw - cropW) / 2);
            const sy = Math.floor((vh - cropH) / 2);

            const canvas = document.createElement('canvas');
            canvas.width = cropW;
            canvas.height = cropH;
            const ctx = canvas.getContext('2d');
            ctx.filter = 'grayscale(100%) contrast(180%)';
            ctx.drawImage(vid, sx, sy, cropW, cropH, 0, 0, cropW, cropH);

            let text = await runTesseractOnCanvas(canvas);
            let parsed = parseDateFromOcrText(text);

            // Ak sa nenašlo, skúsime horizontálne odzrkadlenú verziu
            if (!parsed) {
                const flipCanvas = document.createElement('canvas');
                flipCanvas.width = cropW;
                flipCanvas.height = cropH;
                const fctx = flipCanvas.getContext('2d');
                fctx.translate(cropW, 0);
                fctx.scale(-1, 1);
                fctx.drawImage(canvas, 0, 0);
                const flipText = await runTesseractOnCanvas(flipCanvas);
                parsed = parseDateFromOcrText(flipText);
            }

            if (parsed) {
                playBeep('IN');
                document.getElementById('exp-date-input').value = parsed;
                statusEl.innerText = `✅ Načítaný dátum: ${parsed}`;
                stopOcrCamera();
            } else {
                playBeep('ERR');
                statusEl.innerText = `❌ Nepodarilo sa prečítať (skús lepšie svetlo alebo zadaj ručne)`;
            }
        }

        // Hlavný skener EAN + zrkadlové snímanie pre prednú kameru
        async function initCameras() {
            updateStatus('🔍 Hľadám kamery...', 'Povoľ kameru ak vyskočí okno');
            try {
                cameras = await Html5Qrcode.getCameras();
                if (!cameras || cameras.length === 0) {
                    updateStatus('❌ Žiadna kamera', 'Zariadenie nenašlo kameru');
                    return;
                }
                const frontIdx = cameras.findIndex(c => isFrontCamera(c));
                currentCameraIndex = frontIdx !== -1 ? frontIdx : 0;
                startSelectedCamera();
            } catch (err) {
                updateStatus('⚠️ Kamera blokovaná', 'Povoľ fotoaparát v nastaveniach prehliadača a systému');
            }
        }

        async function startSelectedCamera() {
            if (!cameras.length) return;
            await stopCamera(true);

            const cam = cameras[currentCameraIndex];
            html5QrCode = new Html5Qrcode("reader", {
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E
                ],
                experimentalFeatures: { useBarCodeDetectorIfSupported: true }
            });

            try {
                await html5QrCode.start(
                    cam.id,
                    { fps: 15, aspectRatio: 1.5 },
                    (decodedText) => handleScan(decodedText),
                    () => {}
                );
                isScanning = true;
                document.getElementById('start-cam-overlay').style.display = 'none';
                updateStatus('✅ Kamera beží', `Aktívna: ${cam.label || 'Kamera ' + (currentCameraIndex + 1)}`);
                startMirrorScanner();
            } catch (err) {
                updateStatus('⚠️ Chyba štartu kamery', String(err));
            }
        }

        function startMirrorScanner() {
            clearInterval(mirrorInterval);
            if (!('BarcodeDetector' in window)) return;
            const detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
            const canvas = document.getElementById('mirror-canvas');
            const ctx = canvas.getContext('2d');

            mirrorInterval = setInterval(async () => {
                if (!isScanning) return;
                const video = document.querySelector('#reader video');
                if (!video || !video.videoWidth) return;

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.save();
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                ctx.restore();

                try {
                    const codes = await detector.detect(canvas);
                    if (codes && codes.length > 0 && codes[0].rawValue) {
                        handleScan(codes[0].rawValue);
                    }
                } catch (e) {}
            }, 350);
        }

        async function stopCamera(keepOverlay = false) {
            clearInterval(mirrorInterval);
            torchOn = false;
            if (html5QrCode && isScanning) {
                try {
                    await html5QrCode.stop();
                } catch (e) {}
            }
            isScanning = false;
            if (!keepOverlay) {
                document.getElementById('start-cam-overlay').style.display = 'flex';
                updateStatus('⏹ Kamera vypnutá', 'Ťukni na modré tlačidlo pre zapnutie');
            }
        }

        function switchCamera() {
            if (cameras.length <= 1) {
                initCameras();
                return;
            }
            currentCameraIndex = (currentCameraIndex + 1) % cameras.length;
            startSelectedCamera();
        }

        function cycleZoom() {
            zoomIdx = (zoomIdx + 1) % zoomLevels.length;
            const z = zoomLevels[zoomIdx];
            document.getElementById('reader').style.transform = `scale(${z})`;
            document.getElementById('btn-zoom').innerText = `🔍 ${z}x`;
        }

        async function toggleTorch() {
            if (!html5QrCode || !isScanning) return;
            try {
                torchOn = !torchOn;
                await html5QrCode.applyVideoConstraints({ advanced: [{ torch: torchOn }] });
            } catch (e) {
                updateStatus('ℹ️ Blesk nie je na tejto kamere dostupný', '');
            }
        }

        // Záloha a obnova
        function exportBackup() {
            const payload = {
                version: 'v12',
                exportedAt: new Date().toISOString(),
                inventory: inventory,
                catalog: productCatalog
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dateStr = new Date().toISOString().split('T')[0];
            a.href = url;
            a.download = `chladnicka-zaloha-${dateStr}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.inventory) inventory = data.inventory;
                    if (data.catalog) {
                        productCatalog = { ...productCatalog, ...data.catalog };
                        localStorage.setItem('fridge_catalog', JSON.stringify(productCatalog));
                    }
                    saveAndSync();
                    updateStatus('✅ Záloha úspešne obnovená', `Načítaných položiek: ${Object.keys(inventory).length}`);
                } catch (err) {
                    updateStatus('❌ Neplatný súbor zálohy', '');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // Cloud synchronizácia (Firebase Realtime DB)
        function openCloudModal() {
            if (cloudConfig) {
                document.getElementById('fb-url-input').value = cloudConfig.url || '';
                document.getElementById('fb-room-input').value = cloudConfig.room || '';
            }
            document.getElementById('cloud-modal').style.display = 'flex';
        }

        function saveCloudSettings() {
            let url = document.getElementById('fb-url-input').value.trim().replace(/\/+$/, '');
            const room = document.getElementById('fb-room-input').value.trim().replace(/[^a-zA-Z0-9_-]/g, '');
            if (!url || !room) return;
            cloudConfig = { url, room };
            localStorage.setItem('fridge_cloud', JSON.stringify(cloudConfig));
            closeModal('cloud-modal');
            startCloudSync();
            pushToCloud();
        }

        function disconnectCloud() {
            cloudConfig = null;
            localStorage.removeItem('fridge_cloud');
            clearInterval(cloudPollTimer);
            document.getElementById('btn-cloud').classList.remove('cloud-on');
            closeModal('cloud-modal');
        }

        async function pushToCloud() {
            if (!cloudConfig) return;
            try {
                await fetch(`${cloudConfig.url}/fridges/${cloudConfig.room}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ inventory, catalog: productCatalog, updatedAt: Date.now() })
                });
                document.getElementById('btn-cloud').classList.add('cloud-on');
            } catch (e) {}
        }

        async function pullFromCloud() {
            if (!cloudConfig) return;
            try {
                const res = await fetch(`${cloudConfig.url}/fridges/${cloudConfig.room}.json`);
                const data = await res.json();
                if (data && data.inventory) {
                    inventory = data.inventory;
                    if (data.catalog) {
                        productCatalog = { ...productCatalog, ...data.catalog };
                        localStorage.setItem('fridge_catalog', JSON.stringify(productCatalog));
                    }
                    localStorage.setItem('fridge_inventory', JSON.stringify(inventory));
                    renderInventory();
                    document.getElementById('btn-cloud').classList.add('cloud-on');
                }
            } catch (e) {}
        }

        function startCloudSync() {
            if (!cloudConfig) return;
            document.getElementById('btn-cloud').classList.add('cloud-on');
            pullFromCloud();
            clearInterval(cloudPollTimer);
            cloudPollTimer = setInterval(pullFromCloud, 4000);
        }

        renderInventory();
        if (cloudConfig) startCloudSync();
    </script>
