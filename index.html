<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chladnička Kiosk v16</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-dark: #121214;
            --card-bg: #1e1e24;
            --text-main: #ffffff;
            --text-muted: #a0a0ab;
            --color-out: #ef4444;
            --color-in: #22c55e;
            --color-ret: #eab308;
            --color-warn: #f97316;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; border: 6px solid var(--color-out); transition: border-color 0.2s ease, background-color 0.15s; }
        body.mode-in { border-color: var(--color-in); }
        body.mode-ret { border-color: var(--color-ret); }
        body.flash-error { background-color: #450a0a; }
        .modes-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 8px; background: #09090b; flex-shrink: 0; }
        .mode-btn { padding: 10px 4px; border: 2px solid transparent; border-radius: 10px; font-size: 0.95rem; font-weight: 800; color: white; background: var(--card-bg); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .mode-btn span.sub { font-size: 0.7rem; font-weight: 400; opacity: 0.85; }
        .mode-btn.active-out { background: var(--color-out); }
        .mode-btn.active-in { background: var(--color-in); color: #000; }
        .mode-btn.active-ret { background: var(--color-ret); color: #000; }
        .main-layout { display: grid; grid-template-columns: 330px 1fr; gap: 10px; padding: 0 10px 10px 10px; flex: 1; min-height: 0; overflow: hidden; }
        @media (max-width: 768px) { .main-layout { grid-template-columns: 1fr; grid-template-rows: 270px 1fr; } }
        .scanner-panel { background: var(--card-bg); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
        .mult-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; flex-shrink: 0; }
        .mult-btn { background: #121214; border: 1px solid #3f3f46; color: white; padding: 6px 0; border-radius: 8px; font-weight: 800; font-size: 0.85rem; cursor: pointer; }
        .mult-btn.active { background: #3b82f6; border-color: #60a5fa; }
        .camera-wrapper { position: relative; width: 100%; flex: 1; min-height: 110px; background: #000; border-radius: 10px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #reader { width: 100%; height: 100%; transition: transform 0.2s; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
        .laser-line { position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; background: rgba(239, 68, 68, 0.85); box-shadow: 0 0 8px #ef4444; pointer-events: none; z-index: 5; }
        #start-cam-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; padding: 10px; text-align: center; }
        .big-start-btn { background: #3b82f6; color: white; border: none; padding: 12px 18px; font-size: 1rem; font-weight: 800; border-radius: 10px; cursor: pointer; }
        .cam-quick-tools { position: absolute; top: 6px; right: 6px; z-index: 8; display: flex; gap: 4px; }
        .tool-pill { background: rgba(0,0,0,0.7); color: white; border: 1px solid rgba(255,255,255,0.25); padding: 4px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: bold; cursor: pointer; }
        .tool-pill.stop { background: rgba(185, 28, 28, 0.85); border-color: #f87171; }
        .status-box { background: #121214; padding: 6px 8px; border-radius: 8px; text-align: center; min-height: 44px; display: flex; flex-direction: column; justify-content: center; flex-shrink: 0; }
        .status-title { font-weight: bold; font-size: 0.88rem; }
        .status-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }
        .manual-input { display: flex; gap: 4px; flex-shrink: 0; }
        .manual-input input { flex: 1; background: #121214; border: 1px solid #333; color: white; padding: 7px; border-radius: 8px; font-size: 0.88rem; }
        .manual-input button { background: #3f3f46; color: white; border: none; padding: 0 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .inventory-panel { background: var(--card-bg); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
        .inv-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid #2e2e36; flex-wrap: wrap; gap: 6px; flex-shrink: 0; }
        .ver-tag { background: #166534; color: #86efac; border: 1px solid #22c55e; font-size: 0.7rem; font-weight: 800; padding: 2px 6px; border-radius: 5px; margin-left: 5px; vertical-align: middle; }
        .header-actions { display: flex; gap: 5px; flex-wrap: wrap; }
        .action-btn { background: #27272a; color: white; border: 1px solid #3f3f46; padding: 5px 8px; border-radius: 7px; cursor: pointer; font-size: 0.75rem; font-weight: 600; }
        .action-btn.toggle-on { background: #166534; border-color: #22c55e; color: #dcfce7; }
        .action-btn.cloud-on { background: #1e3a8a; border-color: #3b82f6; color: #dbeafe; }
        .filter-bar { display: flex; gap: 6px; margin-bottom: 8px; flex-shrink: 0; }
        .search-wrap { position: relative; flex: 1; display: flex; }
        .search-wrap input { width: 100%; background: #121214; border: 1px solid #3f3f46; color: white; padding: 7px 26px 7px 9px; border-radius: 8px; font-size: 0.85rem; }
        .clear-search { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); font-size: 0.9rem; cursor: pointer; display: none; }
        .sort-select { background: #121214; border: 1px solid #3f3f46; color: white; padding: 7px 8px; border-radius: 8px; font-size: 0.8rem; max-width: 165px; }
        .inv-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
        .inv-item { background: #121214; padding: 9px 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #3f3f46; gap: 6px; }
        .inv-item.opened { border-left-color: var(--color-ret); }
        .inv-item.exp-soon { border-left-color: var(--color-warn); background: #271a12; }
        .inv-item.expired { border-left-color: var(--color-out); background: #2a1215; }
        .inv-item.empty { opacity: 0.45; }
        .item-info { flex: 1; min-width: 0; }
        .item-name { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-name.unnamed { color: #93c5fd; text-decoration: underline; cursor: pointer; }
        .item-meta { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
        .badge { font-size: 0.65rem; font-weight: 800; padding: 2px 5px; border-radius: 4px; }
        .badge-open { background: var(--color-ret); color: #000; }
        .badge-exp-ok { background: #27272a; color: #d4d4d8; }
        .badge-exp-soon { background: var(--color-warn); color: #000; }
        .badge-expired { background: var(--color-out); color: #fff; }
        .item-controls { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
        .qty-badge { font-size: 1.1rem; font-weight: 800; min-width: 28px; text-align: center; }
        .ctrl-btn { width: 32px; height: 32px; border-radius: 7px; border: none; background: #27272a; color: white; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); justify-content: center; align-items: center; z-index: 100; padding: 14px; }
        .modal-content { background: var(--card-bg); padding: 18px; border-radius: 14px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; max-height: 92dvh; overflow-y: auto; }
        .modal-content label { font-size: 0.78rem; color: var(--text-muted); margin-bottom: -6px; }
        .modal-content input[type="text"], .modal-content input[type="number"], .modal-content input[type="date"] { padding: 10px; font-size: 0.95rem; border-radius: 8px; border: 1px solid #444; background: #121214; color: white; width: 100%; }
        .quick-days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .quick-days button { background: #27272a; color: white; border: 1px solid #3f3f46; padding: 8px 2px; border-radius: 7px; font-size: 0.78rem; font-weight: bold; cursor: pointer; }
        .ocr-box { background: #121214; border: 1px dashed #3b82f6; border-radius: 10px; padding: 10px; text-align: center; }
        .ocr-video-wrap { position: relative; width: 100%; height: 150px; background: #000; border-radius: 8px; overflow: hidden; margin: 8px 0; display: none; }
        .ocr-video-wrap video { width: 100%; height: 100%; object-fit: cover; }
        .ocr-video-wrap video.mirrored { transform: scaleX(-1); }
        .ocr-guide { position: absolute; left: 6%; right: 6%; top: 24%; bottom: 24%; border: 2px solid #22c55e; border-radius: 6px; box-shadow: 0 0 0 999px rgba(0,0,0,0.5); pointer-events: none; }
        .modal-actions { display: flex; gap: 8px; margin-top: 4px; }
        .modal-actions button { flex: 1; padding: 11px; border-radius: 8px; border: none; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="modes-bar">
        <button id="btn-out" class="mode-btn active-out" onclick="setMode('OUT')">🔴 VÝBER (-<span class="m-val">1</span>)<span class="sub">Predvolený režim</span></button>
        <button id="btn-in" class="mode-btn" onclick="setMode('IN')">🟢 NÁKUP (+<span class="m-val">1</span>)<span class="sub" id="timer-in">Vkladám dnu</span></button>
        <button id="btn-ret" class="mode-btn" onclick="setMode('RET')">🟡 VRÁTENIE<span class="sub" id="timer-ret">Otvorené / Späť</span></button>
    </div>

    <div class="main-layout">
        <div class="scanner-panel">
            <div class="mult-bar">
                <button class="mult-btn active" onclick="setMultiplier(1)">1x</button>
                <button class="mult-btn" onclick="setMultiplier(2)">2x</button>
                <button class="mult-btn" onclick="setMultiplier(3)">3x</button>
                <button class="mult-btn" onclick="setMultiplier(4)">4x</button>
                <button class="mult-btn" onclick="setMultiplier(5)">5x</button>
            </div>
            <div class="camera-wrapper">
                <div id="reader"></div>
                <div class="laser-line"></div>
                <div class="cam-quick-tools" id="cam-tools" style="display:none;">
                    <button class="tool-pill" onclick="toggleZoom()">🔍 <span id="zoom-lbl">1x</span></button>
                    <button class="tool-pill" id="torch-btn" onclick="toggleTorch()" style="display:none;">🔦</button>
                    <button class="tool-pill" onclick="switchCamera()">🔄</button>
                    <button class="tool-pill stop" onclick="stopCamera()">⏹ Vypnúť</button>
                </div>
                <div id="start-cam-overlay">
                    <button class="big-start-btn" onclick="initCameras()">📷 ZAPNÚŤ KAMERU</button>
                </div>
            </div>
            <div class="status-box" id="status-box">
                <div class="status-title">Pripravený na snímanie</div>
                <div class="status-sub">Zapni kameru alebo zadaj EAN</div>
            </div>
            <div class="manual-input">
                <input type="text" id="manual-ean" placeholder="Zadať EAN ručne..." inputmode="numeric">
                <button onclick="manualScan()">OK</button>
            </div>
        </div>

        <div class="inventory-panel">
            <div class="inv-header">
                <h3>🧊 <span id="items-count">0</span> pol. • <span id="total-count">0</span> ks <span class="ver-tag">v16</span></h3>
                <div class="header-actions">
                    <button class="action-btn" id="ask-exp-btn" onclick="toggleAskExpiry()">📅 Spotreba: VYP</button>
                    <button class="action-btn" id="cloud-btn" onclick="openCloudModal()">☁️ Cloud</button>
                    <button class="action-btn" onclick="exportBackup()">💾 Záloha</button>
                    <button class="action-btn" onclick="document.getElementById('import-file').click()">📂 Obnoviť</button>
                    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importBackup(event)">
                </div>
            </div>
            <div class="filter-bar">
                <div class="search-wrap">
                    <input type="text" id="search-input" placeholder="🔍 Hľadať produkt alebo EAN..." oninput="renderList()">
                    <button class="clear-search" id="clear-search-btn" onclick="clearSearch()">✕</button>
                </div>
                <select class="sort-select" id="sort-select" onchange="changeSort()">
                    <option value="exp-asc">Spotreba: Najskôr končiace</option>
                    <option value="exp-desc">Spotreba: Najdlhšia trvanlivosť</option>
                    <option value="natural">Prirodzene (Posledná zmena)</option>
                    <option value="alpha">Abecedne (A - Z)</option>
                </select>
            </div>
            <div class="inv-list" id="inv-list"></div>
        </div>
    </div>

    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <h3 id="edit-modal-title">Upraviť položku</h3>
            <p style="color:var(--text-muted); font-size:0.78rem;">EAN: <strong id="edit-ean"></strong></p>
            <label>Názov produktu</label>
            <input type="text" id="edit-name" placeholder="Napr. Plnotučné mlieko 1L">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                <div>
                    <label>Počet kusov</label>
                    <input type="number" id="edit-qty" min="0">
                </div>
                <div style="display:flex; align-items:flex-end;">
                    <label style="display:flex; align-items:center; gap:6px; color:white; font-size:0.85rem; padding-bottom:10px; cursor:pointer;">
                        <input type="checkbox" id="edit-opened" style="width:18px; height:18px;"> Otvorené balenie
                    </label>
                </div>
            </div>
            <label>Dátum spotreby (voliteľné)</label>
            <div class="quick-days">
                <button type="button" onclick="setQuickDays(2)">+2 dni</button>
                <button type="button" onclick="setQuickDays(5)">+5 dní</button>
                <button type="button" onclick="setQuickDays(14)">+2 týž.</button>
                <button type="button" onclick="setQuickDays(30)">+1 mes.</button>
            </div>
            <input type="date" id="edit-date">
            <div class="ocr-box">
                <div style="display:flex; gap:6px;">
                    <button type="button" id="btn-start-ocr" onclick="startOcrCamera()" style="background:#3b82f6; color:white; border:none; padding:8px 10px; border-radius:8px; font-weight:bold; flex:1; cursor:pointer; font-size:0.85rem;">📷 Prečítať dátum z obalu</button>
                    <button type="button" onclick="flipOcrCamera()" style="background:#27272a; color:white; border:1px solid #3f3f46; padding:8px 10px; border-radius:8px; font-weight:bold; cursor:pointer;">🔄</button>
                </div>
                <div class="ocr-video-wrap" id="ocr-video-wrap">
                    <video id="ocr-video" autoplay playsinline></video>
                    <div class="ocr-guide"></div>
                </div>
                <button type="button" id="btn-snap-ocr" onclick="captureAndReadDate()" style="display:none; background:#22c55e; color:black; border:none; padding:9px; border-radius:8px; font-weight:800; width:100%; cursor:pointer;">📸 ODFOTIŤ A PREČÍTAŤ</button>
                <div id="ocr-status" style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;"></div>
            </div>
            <div class="modal-actions">
                <button type="button" id="btn-delete-item" style="background:#7f1d1d; color:white; flex:0.6;" onclick="deleteItem()">🗑️ Zmazať</button>
                <button type="button" style="background:#3f3f46; color:white;" onclick="closeEditModal()">Zrušiť</button>
                <button type="button" style="background:var(--color-in); color:black;" onclick="saveEditModal()">Uložiť</button>
            </div>
        </div>
    </div>

    <div class="modal" id="cloud-modal">
        <div class="modal-content">
            <h3>☁️ Synchronizácia (Firebase)</h3>
            <input type="text" id="fb-url" placeholder="https://tvoj-projekt.firebasedatabase.app">
            <input type="text" id="fb-room" placeholder="Tajný kód domácnosti (napr. rodina2026)">
            <div class="modal-actions">
                <button style="background:#7f1d1d; color:white;" onclick="disconnectCloud()">Odpojiť</button>
                <button style="background:#3f3f46; color:white;" onclick="closeCloudModal()">Zavrieť</button>
                <button style="background:#3b82f6; color:white;" onclick="saveCloudSettings()">Pripojiť</button>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'OUT';
        let multiplier = 1;
        let resetTimer = null;
        let countdownInterval = null;
        let lastScannedCode = null;
        let lastScanTime = 0;
        let editingEan = null;
        let askExpiry = localStorage.getItem('fridge_ask_expiry') === 'true';
        let sortMode = localStorage.getItem('fridge_sort_mode') || 'exp-asc';
        
        let cameras = [];
        let currentCameraIndex = 0;
        let activeFacing = 'user';
        let html5QrCode = null;
        let torchOn = false;
        let zoomLevel = 1;
        let ocrStream = null;
        let ocrUseFront = true;

        let inventory = JSON.parse(localStorage.getItem('fridge_inventory')) || {};
        let productCatalog = JSON.parse(localStorage.getItem('fridge_catalog')) || {};
        let cloudConfig = JSON.parse(localStorage.getItem('fridge_cloud')) || { url: '', room: '' };
        let syncInterval = null;

        document.getElementById('sort-select').value = sortMode;

        function cleanEan(raw) {
            return String(raw || '').trim().replace(/[^0-9]/g, '');
        }

        function setMultiplier(val) {
            multiplier = val;
            document.querySelectorAll('.mult-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', (idx + 1) === val);
            });
            document.querySelectorAll('.m-val').forEach(el => el.innerText = val);
        }

        function playBeep(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (type === 'ERR') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, ctx.currentTime);
                } else {
                    osc.frequency.setValueAtTime(type === 'IN' ? 780 : (type === 'OUT' ? 420 : 600), ctx.currentTime);
                }
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + (type === 'ERR' ? 0.3 : 0.14));
            } catch (e) {}
        }

        function updateAskExpiryBtn() {
            const btn = document.getElementById('ask-exp-btn');
            btn.innerText = askExpiry ? '📅 Spotreba: ZAP' : '📅 Spotreba: VYP';
            btn.classList.toggle('toggle-on', askExpiry);
        }

        function toggleAskExpiry() {
            askExpiry = !askExpiry;
            localStorage.setItem('fridge_ask_expiry', askExpiry);
            updateAskExpiryBtn();
        }

        function changeSort() {
            sortMode = document.getElementById('sort-select').value;
            localStorage.setItem('fridge_sort_mode', sortMode);
            renderList();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            renderList();
        }

        function setMode(mode) {
            currentMode = mode;
            document.body.className = mode === 'IN' ? 'mode-in' : (mode === 'RET' ? 'mode-ret' : '');
            document.getElementById('btn-out').className = 'mode-btn' + (mode === 'OUT' ? ' active-out' : '');
            document.getElementById('btn-in').className = 'mode-btn' + (mode === 'IN' ? ' active-in' : '');
            document.getElementById('btn-ret').className = 'mode-btn' + (mode === 'RET' ? ' active-ret' : '');

            clearTimeout(resetTimer); clearInterval(countdownInterval);
            document.getElementById('timer-in').innerText = 'Vkladám dnu';
            document.getElementById('timer-ret').innerText = 'Otvorené / Späť';

            if (mode !== 'OUT') {
                let s = 60;
                const lbl = mode === 'IN' ? 'timer-in' : 'timer-ret';
                document.getElementById(lbl).innerText = `Návrat za ${s}s`;
                countdownInterval = setInterval(() => { s--; document.getElementById(lbl).innerText = `Návrat za ${s}s`; }, 1000);
                resetTimer = setTimeout(() => setMode('OUT'), 60000);
            }
        }

        function findLocalName(ean) {
            if (productCatalog[ean]) return productCatalog[ean];
            if (inventory[ean] && inventory[ean].name && !inventory[ean].unnamed) return inventory[ean].name;
            const noZero = ean.replace(/^0+/, '');
            for (const k of Object.keys(productCatalog)) {
                if (k.replace(/^0+/, '') === noZero) return productCatalog[k];
            }
            for (const k of Object.keys(inventory)) {
                if (k.replace(/^0+/, '') === noZero && inventory[k].name && !inventory[k].unnamed) return inventory[k].name;
            }
            return null;
        }

        function handleScan(rawEan) {
            const ean = cleanEan(rawEan);
            if (!ean || ean.length < 4) return;

            const now = Date.now();
            if (ean === lastScannedCode && (now - lastScanTime) < 1200) return;
            lastScannedCode = ean;
            lastScanTime = now;

            if (currentMode !== 'OUT') setMode(currentMode);

            if (currentMode === 'OUT') {
                const currentQty = inventory[ean] ? (Number(inventory[ean].qty) || 0) : 0;
                if (currentQty <= 0) {
                    playBeep('ERR');
                    document.body.classList.add('flash-error');
                    setTimeout(() => document.body.classList.remove('flash-error'), 400);
                    const knownName = findLocalName(ean) || `Kód ${ean}`;
                    updateStatus(`⛔ POZOR: 0 ks na sklade!`, `${knownName} – prepni na zelený NÁKUP`);
                    setMultiplier(1);
                    return;
                }
            }

            playBeep(currentMode);
            const qtyStep = multiplier;
            setMultiplier(1);

            let localName = findLocalName(ean);
            if (localName) {
                applyChange(ean, localName, false, qtyStep);
                if (askExpiry && (currentMode === 'IN' || currentMode === 'RET')) {
                    openEditModal(ean);
                }
            } else {
                const tempName = `Produkt ${ean}`;
                applyChange(ean, tempName, true, qtyStep);
                if (askExpiry && (currentMode === 'IN' || currentMode === 'RET')) {
                    openEditModal(ean);
                }
                fetchNameInBackground(ean);
            }
        }

        async function fetchNameInBackground(ean) {
            try {
                const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${ean}.json`);
                const data = await res.json();
                if (data.status === 1 && data.product) {
                    const onlineName = data.product.product_name_sk || data.product.product_name_cs || data.product.product_name || data.product.generic_name;
                    if (onlineName) {
                        productCatalog[ean] = onlineName;
                        localStorage.setItem('fridge_catalog', JSON.stringify(productCatalog));
                        if (inventory[ean] && inventory[ean].unnamed) {
                            inventory[ean].name = onlineName;
                            inventory[ean].unnamed = false;
                            saveAndSync();
                        }
                    }
                }
            } catch (e) {}
        }

        function applyChange(ean, name, isUnnamed, step = 1) {
            if (!inventory[ean]) {
                inventory[ean] = { name: name, qty: 0, opened: false, expiry: '', updated: '', ts: Date.now(), unnamed: isUnnamed };
            }
            if (!isUnnamed) {
                inventory[ean].name = name;
                inventory[ean].unnamed = false;
            }
            inventory[ean].updated = new Date().toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });
            inventory[ean].ts = Date.now();

            const prevQty = Number(inventory[ean].qty) || 0;

            if (currentMode === 'IN') {
                inventory[ean].qty = prevQty + step;
                inventory[ean].opened = false;
                updateStatus(`✅ +${step} ks: ${inventory[ean].name}`, `Spolu: ${inventory[ean].qty} ks`);
            } else if (currentMode === 'OUT') {
                if (prevQty < step) {
                    inventory[ean].qty = 0;
                    updateStatus(`⚠️ Odobratých iba ${prevQty} ks (žiadaných ${step})`, `${inventory[ean].name} je na 0 ks`);
                } else {
                    inventory[ean].qty = prevQty - step;
                    updateStatus(`🔴 -${step} ks: ${inventory[ean].name}`, `Zostáva: ${inventory[ean].qty} ks`);
                }
                if (inventory[ean].qty === 0) {
                    inventory[ean].opened = false;
                    inventory[ean].expiry = '';
                }
            } else if (currentMode === 'RET') {
                if (prevQty === 0) inventory[ean].qty = step;
                inventory[ean].opened = true;
                updateStatus(`🟡 Vrátené: ${inventory[ean].name}`, `Označené ako otvorené`);
            }
            saveAndSync();
        }

        function openEditModal(ean) {
            editingEan = ean;
            const item = inventory[ean];
            if (!item) return;
            document.getElementById('edit-ean').innerText = ean;
            document.getElementById('edit-name').value = item.unnamed ? '' : item.name;
            document.getElementById('edit-qty').value = Number(item.qty) || 0;
            document.getElementById('edit-opened').checked = item.opened || false;
            document.getElementById('edit-date').value = item.expiry || '';
            document.getElementById('ocr-status').innerText = '';
            document.getElementById('ocr-video-wrap').style.display = 'none';
            document.getElementById('btn-snap-ocr').style.display = 'none';
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function setQuickDays(days) {
            const d = new Date();
            d.setDate(d.getDate() + days);
            document.getElementById('edit-date').value = d.toISOString().split('T')[0];
        }

        function saveEditModal() {
            if (!editingEan || !inventory[editingEan]) return;
            const newName = document.getElementById('edit-name').value.trim();
            const newQty = Math.max(0, parseInt(document.getElementById('edit-qty').value) || 0);
            const newOpened = newQty > 0 ? document.getElementById('edit-opened').checked : false;
            const newDate = document.getElementById('edit-date').value;

            if (newName) {
                inventory[editingEan].name = newName;
                inventory[editingEan].unnamed = false;
                productCatalog[editingEan] = newName;
                localStorage.setItem('fridge_catalog', JSON.stringify(productCatalog));
            }
            inventory[editingEan].qty = newQty;
            inventory[editingEan].opened = newOpened;
            inventory[editingEan].expiry = newDate;
            inventory[editingEan].ts = Date.now();
            inventory[editingEan].updated = new Date().toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });

            closeEditModal();
            saveAndSync();
        }

        function deleteItem() {
            if (!editingEan) return;
            delete inventory[editingEan];
            closeEditModal();
            saveAndSync();
        }

        function closeEditModal() {
            stopOcrCamera();
            document.getElementById('edit-modal').style.display = 'none';
            editingEan = null;
        }

        function flipOcrCamera() {
            ocrUseFront = !ocrUseFront;
            startOcrCamera();
        }

        async function startOcrCamera() {
            stopOcrCamera();
            const statusEl = document.getElementById('ocr-status');
            const videoEl = document.getElementById('ocr-video');
            statusEl.innerText = `Zapínam ${ocrUseFront ? 'prednú' : 'zadnú'} kameru...`;
            try {
                ocrStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: ocrUseFront ? 'user' : 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                videoEl.srcObject = ocrStream;
                videoEl.classList.toggle('mirrored', ocrUseFront);
                document.getElementById('ocr-video-wrap').style.display = 'block';
                document.getElementById('btn-snap-ocr').style.display = 'block';
                statusEl.innerText = 'Namier dátum do zeleného rámika a odfoť';
            } catch (e) {
                statusEl.innerText = 'Chyba kamery pri čítaní dátumu.';
            }
        }

        function stopOcrCamera() {
            if (ocrStream) {
                ocrStream.getTracks().forEach(t => t.stop());
                ocrStream = null;
            }
        }

        async function captureAndReadDate() {
            const video = document.getElementById('ocr-video');
            const statusEl = document.getElementById('ocr-status');
            if (!video.videoWidth) return;

            statusEl.innerText = '⏳ Čítam dátum (ignorujem písmená)...';
            const cropW = video.videoWidth * 0.88;
            const cropH = video.videoHeight * 0.52;
            const cropX = (video.videoWidth - cropW) / 2;
            const cropY = (video.videoHeight - cropH) / 2;

            const canvas = document.createElement('canvas');
            canvas.width = cropW; canvas.height = cropH;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

            const imgData = ctx.getImageData(0, 0, cropW, cropH);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                const bw = gray > 125 ? 255 : 0;
                d[i] = d[i + 1] = d[i + 2] = bw;
            }
            ctx.putImageData(imgData, 0, 0);

            try {
                const res = await Tesseract.recognize(canvas, 'eng', {
                    tessedit_char_whitelist: '0123456789./- '
                });
                const cleanDigits = res.data.text.replace(/[^0-9./\- ]/g, ' ').replace(/\s+/g, ' ').trim();
                const parsed = parseDateFromText(cleanDigits);
                if (parsed) {
                    document.getElementById('edit-date').value = parsed;
                    statusEl.innerText = `✅ Prečítané: ${parsed}`;
                    playBeep('IN');
                    stopOcrCamera();
                    document.getElementById('ocr-video-wrap').style.display = 'none';
                    document.getElementById('btn-snap-ocr').style.display = 'none';
                } else {
                    statusEl.innerText = `⚠️ Nenašiel som dátum (zachytil som: "${cleanDigits || 'nič'}").`;
                }
            } catch (e) {
                statusEl.innerText = 'Chyba pri rozpoznávaní textu.';
            }
        }

        function parseDateFromText(txt) {
            const fullMatch = txt.match(/(\d{1,2})[\.\/\- ]+(\d{1,2})[\.\/\- ]+(20\d{2}|\d{2})/);
            if (fullMatch) {
                let day = parseInt(fullMatch[1]);
                let month = parseInt(fullMatch[2]);
                let year = fullMatch[3].length === 2 ? 2000 + parseInt(fullMatch[3]) : parseInt(fullMatch[3]);
                if (day >= 1 && day <= 31 && month >= 1 && month <= 12 && year >= 2024 && year <= 2040) {
                    return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                }
            }
            const mmYyyyMatch = txt.match(/(0?[1-9]|1[0-2])[\.\/\- ]+(20\d{2}|\d{2})/);
            if (mmYyyyMatch) {
                let month = parseInt(mmYyyyMatch[1]);
                let year = mmYyyyMatch[2].length === 2 ? 2000 + parseInt(mmYyyyMatch[2]) : parseInt(mmYyyyMatch[2]);
                if (month >= 1 && month <= 12 && year >= 2024 && year <= 2040) {
                    const lastDay = new Date(year, month, 0).getDate();
                    return `${year}-${String(month).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
                }
            }
            return null;
        }

        function getDaysUntil(dateStr) {
            if (!dateStr) return null;
            const today = new Date(); today.setHours(0, 0, 0, 0);
            const exp = new Date(dateStr); exp.setHours(0, 0, 0, 0);
            return Math.round((exp - today) / 86400000);
        }

        function saveAndSync() {
            localStorage.setItem('fridge_inventory', JSON.stringify(inventory));
            renderList();
            pushToCloud();
        }

        function renderList() {
            const listEl = document.getElementById('inv-list');
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            document.getElementById('clear-search-btn').style.display = query ? 'block' : 'none';
            listEl.innerHTML = '';

            let totalQty = 0;
            let activeItemsCount = 0;
            const allKeys = Object.keys(inventory);

            allKeys.forEach(k => {
                const q = Number(inventory[k].qty) || 0;
                totalQty += q;
                if (q > 0) activeItemsCount++;
            });

            const filteredKeys = allKeys.filter(ean => {
                if (!query) return true;
                const item = inventory[ean];
                return item.name.toLowerCase().includes(query) || ean.includes(query);
            });

            filteredKeys.sort((a, b) => {
                const itemA = inventory[a], itemB = inventory[b];
                if (sortMode === 'alpha') {
                    return itemA.name.localeCompare(itemB.name, 'sk', { sensitivity: 'base' });
                }
                if (sortMode === 'natural') {
                    return (itemB.ts || 0) - (itemA.ts || 0);
                }
                if (sortMode === 'exp-desc') {
                    if (!itemA.expiry && !itemB.expiry) return 0;
                    if (!itemA.expiry) return 1;
                    if (!itemB.expiry) return -1;
                    return new Date(itemB.expiry) - new Date(itemA.expiry);
                }
                if (itemA.opened !== itemB.opened) return itemB.opened - itemA.opened;
                if (itemA.expiry && itemB.expiry) return new Date(itemA.expiry) - new Date(itemB.expiry);
                if (itemA.expiry) return -1;
                if (itemB.expiry) return 1;
                return (Number(itemB.qty) || 0) - (Number(itemA.qty) || 0);
            });

            filteredKeys.forEach(ean => {
                const item = inventory[ean];
                const qtyNum = Number(item.qty) || 0;
                const days = getDaysUntil(item.expiry);
                let expBadge = '', rowClass = item.opened ? 'opened' : '';

                if (days !== null && qtyNum > 0) {
                    if (days < 0) { expBadge = `<span class="badge badge-expired">Po záruke (${Math.abs(days)}d)</span>`; rowClass = 'expired'; }
                    else if (days <= 3) { expBadge = `<span class="badge badge-exp-soon">Spotrebovať do ${days}d</span>`; rowClass = 'exp-soon'; }
                    else { expBadge = `<span class="badge badge-exp-ok">Do ${item.expiry.split('-').reverse().join('.')}</span>`; }
                }

                const div = document.createElement('div');
                div.className = `inv-item ${rowClass} ${qtyNum === 0 ? 'empty' : ''}`;
                div.innerHTML = `
                    <div class="item-info">
                        <div class="item-name ${item.unnamed ? 'unnamed' : ''}" onclick="openEditModal('${ean}')">${item.name}</div>
                        <div class="item-meta">
                            ${item.opened ? '<span class="badge badge-open">Otvorené</span>' : ''}
                            ${expBadge}
                            <span>${item.updated || ''}</span>
                        </div>
                    </div>
                    <div class="item-controls">
                        <button class="ctrl-btn" onclick="openEditModal('${ean}')">✏️</button>
                        <button class="ctrl-btn" onclick="adjustQty('${ean}', -1)">-</button>
                        <div class="qty-badge">${qtyNum}</div>
                        <button class="ctrl-btn" onclick="adjustQty('${ean}', 1)">+</button>
                    </div>
                `;
                listEl.appendChild(div);
            });

            document.getElementById('items-count').innerText = activeItemsCount;
            document.getElementById('total-count').innerText = totalQty;
        }

        function adjustQty(ean, delta) {
            if (!inventory[ean]) return;
            const cur = Number(inventory[ean].qty) || 0;
            if (delta < 0 && cur === 0) {
                playBeep('ERR');
                updateStatus('⛔ Už je 0 ks!', 'Nedá sa odobrať do mínusu');
                return;
            }
            inventory[ean].qty = Math.max(0, cur + delta);
            inventory[ean].ts = Date.now();
            if (inventory[ean].qty === 0) { inventory[ean].opened = false; inventory[ean].expiry = ''; }
            saveAndSync();
        }

        function manualScan() {
            const inp = document.getElementById('manual-ean');
            if (inp.value.trim()) { lastScannedCode = null; handleScan(inp.value.trim()); inp.value = ''; }
        }

        function updateStatus(t, s) {
            document.getElementById('status-box').innerHTML = `<div class="status-title">${t}</div><div class="status-sub">${s}</div>`;
        }

        function exportBackup() {
            const data = { inventory, catalog: productCatalog, exportedAt: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `chladnicka-zaloha-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function importBackup(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (data.inventory) { inventory = data.inventory; saveAndSync(); }
                    if (data.catalog) { productCatalog = data.catalog; localStorage.setItem('fridge_catalog', JSON.stringify(productCatalog)); }
                    updateStatus('✅ Záloha obnovená', 'Dáta boli načítané');
                } catch (err) { alert('Neplatný súbor zálohy.'); }
            };
            reader.readAsText(file);
        }

        function openCloudModal() {
            document.getElementById('fb-url').value = cloudConfig.url;
            document.getElementById('fb-room').value = cloudConfig.room;
            document.getElementById('cloud-modal').style.display = 'flex';
        }
        function closeCloudModal() { document.getElementById('cloud-modal').style.display = 'none'; }
        function saveCloudSettings() {
            let url = document.getElementById('fb-url').value.trim().replace(/\/$/, '');
            const room = document.getElementById('fb-room').value.trim().replace(/[^a-zA-Z0-9_-]/g, '');
            if (!url || !room) return alert('Vyplň URL aj tajný kód.');
            cloudConfig = { url, room };
            localStorage.setItem('fridge_cloud', JSON.stringify(cloudConfig));
            closeCloudModal();
            startCloudSync();
        }
        function disconnectCloud() {
            cloudConfig = { url: '', room: '' };
            localStorage.removeItem('fridge_cloud');
            clearInterval(syncInterval);
            document.getElementById('cloud-btn').classList.remove('cloud-on');
            closeCloudModal();
        }
        async function pushToCloud() {
            if (!cloudConfig.url || !cloudConfig.room) return;
            try {
                await fetch(`${cloudConfig.url}/fridges/${cloudConfig.room}.json`, {
                    method: 'PUT', body: JSON.stringify({ inventory, catalog: productCatalog, updatedAt: Date.now() })
                });
            } catch (e) {}
        }
        async function pullFromCloud() {
            if (!cloudConfig.url || !cloudConfig.room) return;
            try {
                const res = await fetch(`${cloudConfig.url}/fridges/${cloudConfig.room}.json`);
                const data = await res.json();
                if (data && data.inventory) {
                    inventory = data.inventory;
                    localStorage.setItem('fridge_inventory', JSON.stringify(inventory));
                    if (data.catalog) { productCatalog = { ...productCatalog, ...data.catalog }; localStorage.setItem('fridge_catalog', JSON.stringify(productCatalog)); }
                    renderList();
                }
            } catch (e) {}
        }
        function startCloudSync() {
            if (!cloudConfig.url || !cloudConfig.room) return;
            document.getElementById('cloud-btn').classList.add('cloud-on');
            pullFromCloud();
            clearInterval(syncInterval);
            syncInterval = setInterval(pullFromCloud, 4000);
        }

        async function initCameras() {
            try {
                cameras = await Html5Qrcode.getCameras();
                if (!cameras.length) return updateStatus('❌ Žiadna kamera', '');
                const frontIdx = cameras.findIndex(c => c.label.toLowerCase().includes('front') || c.label.toLowerCase().includes('user'));
                currentCameraIndex = frontIdx !== -1 ? frontIdx : 0;
                startSelectedCamera();
            } catch (err) { updateStatus('⚠️ Povoľ kameru v nastaveniach', ''); }
        }

        async function stopCamera() {
            if (html5QrCode && html5QrCode.isScanning) {
                await html5QrCode.stop();
            }
            document.getElementById('start-cam-overlay').style.display = 'flex';
            document.getElementById('cam-tools').style.display = 'none';
            zoomLevel = 1;
            document.getElementById('reader').style.transform = 'scale(1)';
            updateStatus('⏹ Kamera vypnutá', 'Šetrím batériu – klikni Zapnúť');
        }

        async function startSelectedCamera() {
            const cam = cameras[currentCameraIndex];
            const lbl = (cam.label || '').toLowerCase();
            activeFacing = (lbl.includes('back') || lbl.includes('rear') || lbl.includes('environment')) ? 'environment' : 'user';
            ocrUseFront = (activeFacing === 'user');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader", {
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.EAN_13,
                        Html5QrcodeSupportedFormats.EAN_8,
                        Html5QrcodeSupportedFormats.UPC_A,
                        Html5QrcodeSupportedFormats.UPC_E
                    ],
                    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
                });
            } else if (html5QrCode.isScanning) {
                await html5QrCode.stop();
            }

            try {
                await html5QrCode.start(
                    cam.id,
                    { fps: 20, videoConstraints: { deviceId: { exact: cam.id }, width: { ideal: 1280 }, height: { ideal: 720 } } },
                    txt => handleScan(txt),
                    () => {}
                );
                document.getElementById('start-cam-overlay').style.display = 'none';
                document.getElementById('cam-tools').style.display = 'flex';
                const caps = html5QrCode.getRunningTrackCapabilities ? html5QrCode.getRunningTrackCapabilities() : {};
                document.getElementById('torch-btn').style.display = caps.torch ? 'block' : 'none';
                updateStatus('✅ Skener aktívny', activeFacing === 'user' ? 'Predná kamera' : 'Zadná kamera');
            } catch (err) { updateStatus('⚠️ Chyba kamery', String(err)); }
        }

        function toggleZoom() {
            zoomLevel = zoomLevel === 1 ? 1.5 : (zoomLevel === 1.5 ? 2 : 1);
            document.getElementById('zoom-lbl').innerText = zoomLevel + 'x';
            document.getElementById('reader').style.transform = `scale(${zoomLevel})`;
        }

        function switchCamera() {
            if (cameras.length <= 1) return initCameras();
            currentCameraIndex = (currentCameraIndex + 1) % cameras.length;
            torchOn = false;
            zoomLevel = 1;
            document.getElementById('zoom-lbl').innerText = '1x';
            document.getElementById('reader').style.transform = 'scale(1)';
            startSelectedCamera();
        }

        async function toggleTorch() {
            if (!html5QrCode) return;
            torchOn = !torchOn;
            try { await html5QrCode.applyVideoConstraints({ advanced: [{ torch: torchOn }] }); } catch (e) {}
        }

        updateAskExpiryBtn();
        renderList();
        startCloudSync();
    </script>
</body>
