<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chladnička Kiosk v17</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-dark: #121214;
            --card-bg: #1e1e24;
            --text-main: #ffffff;
            --text-muted: #a0a0ab;
            --color-out: #ef4444;
            --color-in: #22c55e;
            --color-ret: #eab308;
            --color-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 8px solid var(--color-out);
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        body.mode-in { border-color: var(--color-in); }
        body.mode-ret { border-color: var(--color-ret); }
        body.flash-error { background-color: #450a0a; border-color: #ff0000; }

        .modes-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            padding: 8px;
            background: #09090b;
            flex-shrink: 0;
        }

        .mode-btn {
            padding: 10px 4px;
            border: 2px solid transparent;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 800;
            color: white;
            background: var(--card-bg);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .mode-btn span.sub { font-size: 0.7rem; font-weight: 400; opacity: 0.85; }
        .mode-btn.active-out { background: var(--color-out); }
        .mode-btn.active-in { background: var(--color-in); color: #000; }
        .mode-btn.active-ret { background: var(--color-ret); color: #000; }

        .main-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 10px;
            padding: 0 10px 10px 10px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
                grid-template-rows: 265px 1fr;
            }
        }

        .scanner-panel {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 0;
        }

        .multiplier-bar {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .mult-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-right: 4px;
            font-weight: 600;
        }

        .mult-btn {
            flex: 1;
            background: #121214;
            color: white;
            border: 1px solid #3f3f46;
            padding: 6px 0;
            border-radius: 7px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .mult-btn.active {
            background: var(--color-blue);
            border-color: var(--color-blue);
        }

        .camera-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 110px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #video-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s;
        }

        #video-preview.mirrored {
            transform: scaleX(-1);
        }

        .laser-line {
            position: absolute;
            left: 10%;
            right: 10%;
            top: 50%;
            height: 2px;
            background: rgba(239, 68, 68, 0.85);
            box-shadow: 0 0 8px #ef4444;
            pointer-events: none;
            z-index: 5;
        }

        #start-cam-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 10px;
            text-align: center;
        }

        .big-start-btn {
            background: var(--color-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
        }

        .status-box {
            background: #121214;
            padding: 6px 8px;
            border-radius: 8px;
            text-align: center;
            min-height: 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .status-title { font-weight: bold; font-size: 0.88rem; }
        .status-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }

        .manual-input { display: flex; gap: 5px; }
        .manual-input input {
            flex: 1;
            background: #121214;
            border: 1px solid #333;
            color: white;
            padding: 7px 9px;
            border-radius: 7px;
            font-size: 0.9rem;
        }
        .manual-input button {
            background: #3f3f46;
            color: white;
            border: none;
            padding: 0 12px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .inventory-panel {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .inv-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            padding-bottom: 6px;
            border-bottom: 1px solid #2e2e36;
            flex-wrap: wrap;
            gap: 5px;
            flex-shrink: 0;
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .ver-badge {
            background: #16a34a;
            color: white;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 5px;
        }

        .cloud-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #71717a;
        }
        .cloud-dot.online { background: #22c55e; box-shadow: 0 0 6px #22c55e; }

        .toolbar {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .tool-btn {
            background: #27272a;
            color: white;
            border: 1px solid #3f3f46;
            padding: 5px 8px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .tool-btn.active-toggle {
            background: #1d4ed8;
            border-color: #60a5fa;
        }

        .tool-btn.stop-btn {
            background: #7f1d1d;
            border-color: #ef4444;
        }

        .filter-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .search-wrap {
            position: relative;
            flex: 1;
            display: flex;
        }

        .search-wrap input {
            width: 100%;
            background: #121214;
            border: 1px solid #3f3f46;
            color: white;
            padding: 7px 26px 7px 9px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .clear-search {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
            display: none;
        }

        .sort-select {
            background: #121214;
            border: 1px solid #3f3f46;
            color: white;
            padding: 7px 6px;
            border-radius: 8px;
            font-size: 0.8rem;
            max-width: 165px;
        }

        .inv-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 2px;
        }

        .inv-item {
            background: #121214;
            padding: 8px 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #3f3f46;
            gap: 6px;
        }

        .inv-item.opened { border-left-color: var(--color-ret); }
        .inv-item.exp-soon { border-left-color: #f97316; background: #1c1510; }
        .inv-item.expired { border-left-color: var(--color-out); background: #221010; }
        .inv-item.empty { opacity: 0.45; }

        .item-info { flex: 1; min-width: 0; }
        .item-name { font-size: 0.95rem; font-weight: 600; word-break: break-word; }
        .item-name.unnamed { color: #60a5fa; text-decoration: underline; cursor: pointer; }
        .item-meta { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }

        .badge {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 1px 5px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .badge-open { background: var(--color-ret); color: #000; }
        .badge-exp-ok { background: #27272a; color: #d4d4d8; cursor: pointer; }
        .badge-exp-soon { background: #f97316; color: #000; cursor: pointer; }
        .badge-expired { background: var(--color-out); color: #fff; cursor: pointer; }

        .item-controls { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
        .qty-badge { font-size: 1.05rem; font-weight: 800; min-width: 26px; text-align: center; }
        .ctrl-btn {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            border: none;
            background: #27272a;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 18px;
            border-radius: 14px;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 92dvh;
            overflow-y: auto;
        }

        .modal-content input[type="text"],
        .modal-content input[type="number"],
        .modal-content input[type="date"] {
            padding: 10px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #444;
            background: #121214;
            color: white;
            width: 100%;
        }

        .quick-days {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .quick-days button {
            padding: 8px 4px;
            background: #27272a;
            color: white;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .ocr-box {
            background: #121214;
            border: 1px solid #3f3f46;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ocr-video-wrap {
            position: relative;
            width: 100%;
            height: 150px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }

        .ocr-video-wrap video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ocr-video-wrap video.mirrored {
            transform: scaleX(-1);
        }

        .ocr-guide {
            position: absolute;
            left: 6%;
            right: 6%;
            top: 50%;
            height: 76px;
            transform: translateY(-50%);
            border: 2px dashed #22c55e;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.48);
            pointer-events: none;
        }

        .modal-actions { display: flex; gap: 8px; }
        .modal-actions button {
            flex: 1;
            padding: 11px;
            border-radius: 9px;
            border: none;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .field-label { font-size: 0.78rem; color: var(--text-muted); margin-bottom: -6px; }
    </style>
</head>
<body>

    <div class="modes-bar">
        <button id="btn-out" class="mode-btn active-out" onclick="setMode('OUT')">
            🔴 VÝBER
            <span class="sub">Predvolený</span>
        </button>
        <button id="btn-in" class="mode-btn" onclick="setMode('IN')">
            🟢 NÁKUP
            <span class="sub" id="timer-in">Vkladám dnu</span>
        </button>
        <button id="btn-ret" class="mode-btn" onclick="setMode('RET')">
            🟡 VRÁTENIE
            <span class="sub" id="timer-ret">Otvorené</span>
        </button>
    </div>

    <div class="main-layout">
        <div class="scanner-panel">
            <div class="multiplier-bar">
                <span class="mult-label">Počet ks:</span>
                <button class="mult-btn active" id="mult-1" onclick="setMultiplier(1)">1x</button>
                <button class="mult-btn" id="mult-2" onclick="setMultiplier(2)">2x</button>
                <button class="mult-btn" id="mult-3" onclick="setMultiplier(3)">3x</button>
                <button class="mult-btn" id="mult-4" onclick="setMultiplier(4)">4x</button>
                <button class="mult-btn" id="mult-5" onclick="setMultiplier(5)">5x</button>
            </div>

            <div class="camera-wrapper">
                <video id="video-preview" playsinline muted></video>
                <div class="laser-line"></div>
                <div id="start-cam-overlay">
                    <button class="big-start-btn" onclick="startScanner()">📷 ZAPNÚŤ KAMERU</button>
                </div>
            </div>

            <div class="status-box" id="status-box">
                <div class="status-title">Pripravený</div>
                <div class="status-sub">Zapni kameru alebo zadaj EAN</div>
            </div>

            <div class="manual-input">
                <input type="text" id="manual-ean" placeholder="EAN kód..." inputmode="numeric">
                <button onclick="manualScan()">OK</button>
            </div>
        </div>

        <div class="inventory-panel">
            <div class="inv-header">
                <div class="header-title-wrap">
                    <h3 style="font-size:1rem;">🧊 <span id="total-summary">0 pol. • 0 ks</span></h3>
                    <span class="ver-badge">v17</span>
                    <span id="cloud-dot" class="cloud-dot" title="Stav cloudu"></span>
                </div>
                <div class="toolbar">
                    <button class="tool-btn" id="btn-ask-exp" onclick="toggleAskExpiry()">📅 Spotreba: VYP</button>
                    <button class="tool-btn" onclick="switchCamera()">🔄 Kamera</button>
                    <button class="tool-btn stop-btn" onclick="stopScanner()">⏹ Vypnúť</button>
                    <button class="tool-btn" onclick="openCloudModal()">☁️ Cloud</button>
                    <button class="tool-btn" onclick="exportBackup()">💾 Záloha</button>
                    <button class="tool-btn" onclick="document.getElementById('import-file').click()">📂 Obnoviť</button>
                    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importBackup(event)">
                </div>
            </div>

            <div class="filter-bar">
                <div class="search-wrap">
                    <input type="text" id="search-input" placeholder="🔍 Hľadať produkt alebo EAN..." oninput="renderInventory()">
                    <button class="clear-search" id="clear-search-btn" onclick="clearSearch()">✕</button>
                </div>
                <select class="sort-select" id="sort-select" onchange="changeSort()">
                    <option value="exp_asc">Spotreba: Najskôr</option>
                    <option value="exp_desc">Spotreba: Najdlhšia</option>
                    <option value="natural">Prirodzene (Zmeny)</option>
                    <option value="alpha">Abecedne (A - Z)</option>
                </select>
            </div>

            <div class="inv-list" id="inv-list"></div>
        </div>
    </div>

    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <h3>✏️ Upraviť položku</h3>
            <p style="color:var(--text-muted); font-size:0.8rem;">EAN: <strong id="edit-ean"></strong></p>

            <span class="field-label">Názov produktu</span>
            <input type="text" id="edit-name" placeholder="Napr. Mlieko 1L">

            <span class="field-label">Počet kusov</span>
            <input type="number" id="edit-qty" min="0" step="1">

            <label style="display:flex; align-items:center; gap:8px; font-size:0.9rem; cursor:pointer; margin-top:4px;">
                <input type="checkbox" id="edit-opened" style="width:18px; height:18px;">
                Označiť ako otvorené (zjesť skôr)
            </label>

            <span class="field-label">Dátum spotreby (voliteľné)</span>
            <input type="date" id="edit-exp-date">

            <div class="quick-days">
                <button onclick="setEditQuickDays(2)">+2 dni</button>
                <button onclick="setEditQuickDays(5)">+5 dní</button>
                <button onclick="setEditQuickDays(14)">+2 týž.</button>
                <button onclick="setEditQuickDays(30)">+1 mes.</button>
            </div>

            <div class="ocr-box">
                <div style="display:flex; gap:6px;">
                    <button id="btn-start-ocr" onclick="toggleOcrCamera()" style="flex:1; background:#2563eb; color:white; border:none; padding:9px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:0.88rem;">
                        📷 Prečítať dátum (<span id="ocr-cam-label">aktívna kamera</span>)
                    </button>
                    <button onclick="switchOcrCamera()" style="background:#3f3f46; color:white; border:none; padding:0 12px; border-radius:8px; font-weight:bold; cursor:pointer;" title="Prepnúť prednú/zadnú kameru">
                        🔄
                    </button>
                </div>
                <div class="ocr-video-wrap" id="ocr-video-wrap">
                    <video id="ocr-video" playsinline muted></video>
                    <div class="ocr-guide"></div>
                </div>
                <button id="btn-snap-ocr" onclick="captureAndReadDate()" style="display:none; background:#16a34a; color:white; border:none; padding:10px; border-radius:8px; font-weight:bold; cursor:pointer;">
                    📸 ODFOTIŤ A PREČÍTAŤ DÁTUM
                </button>
                <div id="ocr-status" style="font-size:0.78rem; color:var(--text-muted); text-align:center;">Podporuje DD.MM.RRRR aj lieky MM RRRR</div>
            </div>

            <div class="modal-actions">
                <button style="background:#7f1d1d; color:white;" onclick="deleteProduct()">🗑 Zmazať</button>
                <button style="background:#3f3f46; color:white;" onclick="closeEditModal()">Zrušiť</button>
                <button style="background:var(--color-in); color:black;" onclick="saveEditModal()">Uložiť</button>
            </div>
        </div>
    </div>

    <div class="modal" id="cloud-modal">
        <div class="modal-content">
            <h3>☁️ Synchronizácia (Firebase)</h3>
            <p style="color:var(--text-muted); font-size:0.82rem;">Prepoj tablet a mobil cez bezplatnú Firebase Realtime Database.</p>
            <input type="text" id="fb-url" placeholder="https://tvoj-projekt.firebasedatabase.app">
            <input type="text" id="fb-room" placeholder="Názov domácnosti (napr. rodina2026)">
            <div class="modal-actions">
                <button style="background:#7f1d1d; color:white;" onclick="disconnectCloud()">Odpojiť</button>
                <button style="background:#3f3f46; color:white;" onclick="closeCloudModal()">Zavrieť</button>
                <button style="background:#2563eb; color:white;" onclick="saveCloudConfig()">Pripojiť</button>
            </div>
        </div>
    </div>

    <canvas id="scan-canvas" style="display:none;"></canvas>

    <script>
        let currentMode = 'OUT';
        let currentMultiplier = 1;
        let resetTimer = null;
        let countdownInterval = null;
        let lastScannedCode = null;
        let lastScanTime = 0;
        let editEan = null;

        let facingMode = 'user';
        let ocrFacingMode = 'user';
        let videoStream = null;
        let scanLoopActive = false;
        let barcodeDetector = null;
        let html5QrFallback = null;
        let ocrStream = null;

        let askExpiry = localStorage.getItem('fridge_ask_exp') === 'true';
        let sortMode = localStorage.getItem('fridge_sort') || 'exp_asc';
        let inventory = JSON.parse(localStorage.getItem('fridge_inventory')) || {};
        let productCatalog = JSON.parse(localStorage.getItem('fridge_catalog')) || {};
        let cloudConfig = JSON.parse(localStorage.getItem('fridge_cloud')) || { url: '', room: '' };
        let cloudSyncTimer = null;

        document.getElementById('sort-select').value = sortMode;
        updateAskExpiryButton();

        function cleanEan(raw) {
            return String(raw || '').trim().replace(/\s+/g, '');
        }

        function findExistingKey(ean) {
            const c = cleanEan(ean);
            if (inventory[c]) return c;
            const noZero = c.replace(/^0+/, '');
            for (const k of Object.keys(inventory)) {
                if (cleanEan(k).replace(/^0+/, '') === noZero) return k;
            }
            return c;
        }

        function findCatalogName(ean) {
            const c = cleanEan(ean);
            if (productCatalog[c]) return productCatalog[c];
            const noZero = c.replace(/^0+/, '');
            for (const k of Object.keys(productCatalog)) {
                if (cleanEan(k).replace(/^0+/, '') === noZero) return productCatalog[k];
            }
            return null;
        }

        function setMultiplier(n) {
            currentMultiplier = n;
            for (let i = 1; i <= 5; i++) {
                document.getElementById('mult-' + i).className = 'mult-btn' + (i === n ? ' active' : '');
            }
        }

        function toggleAskExpiry() {
            askExpiry = !askExpiry;
            localStorage.setItem('fridge_ask_exp', String(askExpiry));
            updateAskExpiryButton();
        }

        function updateAskExpiryButton() {
            const btn = document.getElementById('btn-ask-exp');
            btn.innerText = askExpiry ? '📅 Spotreba: ZAP' : '📅 Spotreba: VYP';
            btn.className = 'tool-btn' + (askExpiry ? ' active-toggle' : '');
        }

        function changeSort() {
            sortMode = document.getElementById('sort-select').value;
            localStorage.setItem('fridge_sort', sortMode);
            renderInventory();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            renderInventory();
        }

        function playBeep(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                if (type === 'ERR') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(190, ctx.currentTime);
                    gain.gain.setValueAtTime(0.35, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.35);
                } else {
                    osc.frequency.setValueAtTime(type === 'IN' ? 800 : (type === 'OUT' ? 420 : 600), ctx.currentTime);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.12);
                }
            } catch (e) {}
        }

        function triggerErrorAlert(msg) {
            playBeep('ERR');
            document.body.classList.add('flash-error');
            setTimeout(() => document.body.classList.remove('flash-error'), 450);

        function setMode(mode) {
            currentMode = mode;
            document.body.className = mode === 'IN' ? 'mode-in' : (mode === 'RET' ? 'mode-ret' : '');
            document.getElementById('btn-out').className = 'mode-btn' + (mode === 'OUT' ? ' active-out' : '');
            document.getElementById('btn-in').className = 'mode-btn' + (mode === 'IN' ? ' active-in' : '');
            document.getElementById('btn-ret').className = 'mode-btn' + (mode === 'RET' ? ' active-ret' : '');

            clearTimeout(resetTimer);
            clearInterval(countdownInterval);
            document.getElementById('timer-in').innerText = 'Vkladám dnu';
            document.getElementById('timer-ret').innerText = 'Otvorené';

        function handleScan(rawEan) {
            const cleaned = cleanEan(rawEan);
            if (!cleaned) return;

            const now = Date.now();
            if (cleaned === lastScannedCode && (now - lastScanTime) < 1300) return;
            lastScannedCode = cleaned;
            lastScanTime = now;

            if (currentMode !== 'OUT') setMode(currentMode);

            const key = findExistingKey(cleaned);
            const qtyStep = currentMultiplier;
            setMultiplier(1);

            if (currentMode === 'OUT') {
                const currentQty = inventory[key] ? (Number(inventory[key].qty) || 0) : 0;
                if (currentQty <= 0) {
                    triggerErrorAlert('Položka má 0 ks!');
                    return;
                }
            }

            playBeep(currentMode);

            let productName = (inventory[key] && inventory[key].name && !inventory[key].unnamed)
                ? inventory[key].name
                : findCatalogName(key);

            const isUnnamed = !productName;
            if (!productName) {
                productName = `Produkt (${key})`;
            }

            applyInventoryChange(key, productName, qtyStep, isUnnamed);

            if (isUnnamed) {
                fetchNameInBackground(key);
            }
        }

        async function fetchNameInBackground(ean) {
            try {
                const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${ean}.json`);
                const data = await res.json();
                if (data.status === 1 && data.product) {
                    const fetched = data.product.product_name_sk || data.product.product_name_cs || data.product.product_name || data.product.generic_name;
                    if (fetched && inventory[ean] && inventory[ean].unnamed) {
                        productCatalog[ean] = fetched;
                        localStorage.setItem('fridge_catalog', JSON.stringify(productCatalog));
                        inventory[ean].name = fetched;
                        inventory[ean].unnamed = false;
                        saveAll();
                    }
                }
            } catch (e) {}
        }

        function applyInventoryChange(ean, name, step, isUnnamed) {
            if (!inventory[ean]) {
                inventory[ean] = { name: name, qty: 0, opened: false, exp: '', updated: '', ts: 0, unnamed: isUnnamed };
            }
            if (!isUnnamed) {
                inventory[ean].name = name;
                inventory[ean].unnamed = false;
            }
            inventory[ean].updated = new Date().toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });
            inventory[ean].ts = Date.now();

            let currentQty = Number(inventory[ean].qty) || 0;

            if (currentMode === 'IN') {
                inventory[ean].qty = currentQty + step;
                inventory[ean].opened = false;
                updateStatus(`✅ +${step} ks: ${inventory[ean].name}`, `Spolu: ${inventory[ean].qty} ks`);
                saveAll();
                if (askExpiry) openEditModal(ean);
            } else if (currentMode === 'OUT') {
                const deducted = Math.min(currentQty, step);
                inventory[ean].qty = Math.max(0, currentQty - step);
                if (inventory[ean].qty === 0) inventory[ean].opened = false;
                updateStatus(`🔴 -${deducted} ks: ${inventory[ean].name}`, `Zostáva: ${inventory[ean].qty} ks`);
                saveAll();
            } else if (currentMode === 'RET') {
                if (currentQty === 0) inventory[ean].qty = 1;
                inventory[ean].opened = true;
                updateStatus(`🟡 Vrátené: ${inventory[ean].name}`, `Označené ako otvorené`);
                saveAll();
                if (askExpiry) openEditModal(ean);
            }
        }

        function prepareOcrCanvas(video, flipHorizontal) {
            const canvas = document.createElement('canvas');
            const cropW = video.videoWidth * 0.88;
            const cropH = video.videoHeight * 0.45;
            const startX = (video.videoWidth - cropW) / 2;
            const startY = (video.videoHeight - cropH) / 2;

            canvas.width = cropW;
            canvas.height = cropH;
            const ctx = canvas.getContext('2d');

            if (flipHorizontal) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, startX, startY, cropW, cropH, 0, 0, cropW, cropH);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                const contrast = gray > 125 ? 255 : 0;
                d[i] = d[i + 1] = d[i + 2] = contrast;
            }
            ctx.putImageData(imgData, 0, 0);
            return canvas;
        }

        async function runTesseract(canvas) {
            const worker = await Tesseract.createWorker('eng');
            await worker.setParameters({
                tessedit_char_whitelist: '0123456789./- '
            });
            const ret = await worker.recognize(canvas);
            await worker.terminate();
            return ret.data.text;
        }

        async function captureAndReadDate() {
            const video = document.getElementById('ocr-video');
            const status = document.getElementById('ocr-status');
            if (!video.videoWidth) return;

            status.innerText = '⏳ Čítam dátum (ignorujem písmená)...';

            try {
                let text = await runTesseract(prepareOcrCanvas(video, false));
                let parsed = parseDateFromText(text);

                if (!parsed) {
                    text = await runTesseract(prepareOcrCanvas(video, true));
                    parsed = parseDateFromText(text);
                }

                if (parsed) {
                    document.getElementById('edit-exp-date').value = parsed;
                    status.innerText = `✅ Načítaný dátum: ${parsed}`;
                    playBeep('IN');
                    stopOcrCamera();
                    document.getElementById('ocr-video-wrap').style.display = 'none';
                    document.getElementById('btn-snap-ocr').style.display = 'none';
                } else {
                    status.innerText = `❌ Nenašiel sa dátum (videl som: "${text.trim().slice(0, 22)}"). Skús znova.`;
                }
            } catch (e) {
                status.innerText = '⚠️ Chyba čítania textu';
            }
        }

        function parseDateFromText(text) {
            const cleaned = text.replace(/[^\d.\-\/\s]/g, ' ').replace(/\s+/g, ' ').trim();

            const fullMatch = cleaned.match(/(\d{1,2})[.\-\/\s]+(\d{1,2})[.\-\/\s]+(20\d{2}|\d{2})/);
            if (fullMatch) {
                let day = fullMatch[1].padStart(2, '0');
                let month = fullMatch[2].padStart(2, '0');
                let year = fullMatch[3].length === 2 ? '20' + fullMatch[3] : fullMatch[3];
                if (parseInt(month) >= 1 && parseInt(month) <= 12 && parseInt(day) >= 1 && parseInt(day) <= 31) {
                    return `${year}-${month}-${day}`;
                }
            }

            const monthYearMatch = cleaned.match(/(0?[1-9]|1[0-2])[.\-\/\s]+(20\d{2}|\d{2})/);
            if (monthYearMatch) {
                let month = monthYearMatch[1].padStart(2, '0');
                let year = monthYearMatch[2].length === 2 ? '20' + monthYearMatch[2] : monthYearMatch[2];
                const yNum = parseInt(year);
                if (yNum >= 2024 && yNum <= 2040) {
                    const lastDay = new Date(yNum, parseInt(month), 0).getDate();
                    return `${year}-${month}-${String(lastDay).padStart(2, '0')}`;
                }
            }

            return null;
        }

        function adjustQty(ean, delta) {
            if (!inventory[ean]) return;
            const cur = Number(inventory[ean].qty) || 0;
            if (delta < 0 && cur <= 0) {
                triggerErrorAlert('Položka už má 0 ks!');
                return;
            }
            inventory[ean].qty = Math.max(0, cur + delta);
            if (inventory[ean].qty === 0) inventory[ean].opened = false;
            inventory[ean].ts = Date.now();
            saveAll();
        }

        function updateStatus(title, sub) {

            `;

        function getExpiryStatus(expStr) {
            if (!expStr) return { type: 'none', days: 99999, label: '+ Spotreba' };
            const today = new Date();
            today.setHours(0,0,0,0);
            const exp = new Date(expStr);
            const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
            const formatted = exp.toLocaleDateString('sk-SK');

            if (diffDays < 0) return { type: 'expired', days: diffDays, label: `Po záruke (${formatted})` };
            if (diffDays <= 3) return { type: 'soon', days: diffDays, label: `Končí o ${diffDays}d (${formatted})` };
            return { type: 'ok', days: diffDays, label: `Do ${formatted}` };
        }

        function renderInventory() {
            const listEl = document.getElementById('inv-list');
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            document.getElementById('clear-search-btn').style.display = query ? 'block' : 'none';

            listEl.innerHTML = '';
            let totalPieces = 0;
            let activeItems = 0;

            Object.keys(inventory).forEach(ean => {
                const q = Number(inventory[ean].qty) || 0;
                totalPieces += q;
                if (q > 0) activeItems++;
            });

            document.getElementById('total-summary').innerText = `${activeItems} pol. • ${totalPieces} ks`;

            let keys = Object.keys(inventory).filter(ean => {
                if (!query) return true;
                const item = inventory[ean];
                return item.name.toLowerCase().includes(query) || ean.includes(query);
            });

            keys.sort((a, b) => {
                const itemA = inventory[a];
                const itemB = inventory[b];

                if (sortMode === 'alpha') {
                    return itemA.name.localeCompare(itemB.name, 'sk', { sensitivity: 'base' });
                }
                if (sortMode === 'natural') {
                    return (itemB.ts || 0) - (itemA.ts || 0);
                }
                if (sortMode === 'exp_desc') {
                    const dA = itemA.exp ? new Date(itemA.exp).getTime() : -1;
                    const dB = itemB.exp ? new Date(itemB.exp).getTime() : -1;
                    return dB - dA;
                }
                if (itemA.opened !== itemB.opened) return itemB.opened - itemA.opened;
                const expA = getExpiryStatus(itemA.exp).days;
                const expB = getExpiryStatus(itemB.exp).days;
                if (expA !== expB) return expA - expB;
                return (Number(itemB.qty) || 0) - (Number(itemA.qty) || 0);
            });

            keys.forEach(ean => {
                const item = inventory[ean];
                const q = Number(item.qty) || 0;
                const expInfo = getExpiryStatus(item.exp);

                let rowClass = '';
                if (q === 0) rowClass = 'empty';
                else if (expInfo.type === 'expired') rowClass = 'expired';
                else if (expInfo.type === 'soon') rowClass = 'exp-soon';
                else if (item.opened) rowClass = 'opened';

                const expBadgeClass = expInfo.type === 'expired' ? 'badge-expired' : (expInfo.type === 'soon' ? 'badge-exp-soon' : 'badge-exp-ok');

                const div = document.createElement('div');
                div.className = `inv-item ${rowClass}`;
                div.innerHTML = `
                    <div class="item-info">
                        <div class="item-name ${item.unnamed ? 'unnamed' : ''}" onclick="${item.unnamed ? `openEditModal('${ean}')` : ''}">${item.name}</div>
                        <div class="item-meta">
                            ${item.opened ? '<span class="badge badge-open">Otvorené</span>' : ''}
                            <span class="badge ${expBadgeClass}" onclick="openEditModal('${ean}')">📅 ${expInfo.label}</span>
                            <span>${item.updated || ''}</span>
                        </div>
                    </div>
                    <div class="item-controls">
                        <button class="ctrl-btn" onclick="openEditModal('${ean}')" title="Upraviť">✏️</button>
                        <button class="ctrl-btn" onclick="adjustQty('${ean}', -1)">-</button>
                        <div class="qty-badge">${q}</div>
                        <button class="ctrl-btn" onclick="adjustQty('${ean}', 1)">+</button>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        async function pushToCloud() {

                await fetch(`${cloudConfig.url}/fridges/${cloudConfig.room}.json`, {
                    method: 'PUT',

                });

        async function pullFromCloud() {
            if (!cloudConfig.url || !cloudConfig.room) return;
            try {
                const res = await fetch(`${cloudConfig.url}/fridges/${cloudConfig.room}.json`);
                const data = await res.json();
                if (data && data.inventory && JSON.stringify(data.inventory) !== JSON.stringify(inventory)) {
                    inventory = data.inventory;
                    if (data.productCatalog) {
                        productCatalog = { ...productCatalog, ...data.productCatalog };

        function stopScanner() {
            scanLoopActive = false;
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
            }
            const video = document.getElementById('video-preview');
            video.srcObject = null;

        async function startScanner() {
            stopScanner();
            const video = document.getElementById('video-preview');
            if (facingMode === 'user') video.classList.add('mirrored');
            else video.classList.remove('mirrored');

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                video.srcObject = videoStream;
                await video.play();
                document.getElementById('start-cam-overlay').style.display = 'none';
                updateStatus('✅ Kamera beží', facingMode === 'user' ? 'Predná kamera (odzrkadlená)' : 'Zadná kamera');

                if ('BarcodeDetector' in window) {
                    const formats = await BarcodeDetector.getSupportedFormats();
                    const wanted = ['ean_13', 'ean_8', 'upc_a', 'upc_e'].filter(f => formats.includes(f));
                    barcodeDetector = new BarcodeDetector({ formats: wanted.length ? wanted : formats });
                    scanLoopActive = true;
                    fastScanLoop();
                } else {
                    startFallbackScanner();
                }
            } catch (err) {
                updateStatus('⚠️ Kamera blokovaná', 'Povoľ fotoaparát v Chrome aj v systéme');
            }
        }

        async function fastScanLoop() {
            const video = document.getElementById('video-preview');
            const canvas = document.getElementById('scan-canvas');
            const ctx = canvas.getContext('2d');

            while (scanLoopActive && videoStream) {
                if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
                    try {
                        let source = video;
                        if (facingMode === 'user') {
                            if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                                canvas.width = video.videoWidth;
                                canvas.height = video.videoHeight;
                            }
                            ctx.save();
                            ctx.translate(canvas.width, 0);
                            ctx.scale(-1, 1);
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            ctx.restore();
                            source = canvas;
                        }
                        const barcodes = await barcodeDetector.detect(source);
                        if (barcodes && barcodes.length > 0) {
                            handleScan(barcodes[0].rawValue);
                        }
                    } catch (e) {}
                }
                await new Promise(r => setTimeout(r, 110));
            }
        }

        function startFallbackScanner() {
            const canvas = document.getElementById('scan-canvas');
            const ctx = canvas.getContext('2d');
            const video = document.getElementById('video-preview');
            if (!html5QrFallback) {
                const dummyDiv = document.createElement('div');
                dummyDiv.id = 'dummy-qr';
                dummyDiv.style.display = 'none';
                document.body.appendChild(dummyDiv);
                html5QrFallback = new Html5Qrcode('dummy-qr', {
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.EAN_13,
                        Html5QrcodeSupportedFormats.EAN_8,
                        Html5QrcodeSupportedFormats.UPC_A
                    ]
                });
            }
            scanLoopActive = true;
            const tick = async () => {
                if (!scanLoopActive || !videoStream) return;
                if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    ctx.save();
                    if (facingMode === 'user') {
                        ctx.translate(canvas.width, 0);
                        ctx.scale(-1, 1);
                    }
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    ctx.restore();
                    canvas.toBlob(async (blob) => {
                        if (blob && scanLoopActive) {
                            try {
                                const file = new File([blob], 'f.jpg', { type: 'image/jpeg' });
                                const res = await html5QrFallback.scanFile(file, false);
                                if (res) handleScan(res);
                            } catch (e) {}
                        }
                        if (scanLoopActive) setTimeout(tick, 220);
                    }, 'image/jpeg', 0.8);
                } else {
                    setTimeout(tick, 200);
                }
            };
            tick();
        }

        function switchCamera() {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            startScanner();
        }

        renderInventory();
        startCloudSync();
    </script>
</body>
</html>
